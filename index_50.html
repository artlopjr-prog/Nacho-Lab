<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Nacho Lab</title>
  <meta name="theme-color" content="#0a0000"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="NachoLab"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080000;--bg2:#120000;--bg3:#1c0000;--bg4:#260202;
  --fire1:#ff1a00;--fire2:#ff5500;--fire3:#ff9900;--fire4:#ffcc00;
  --cream:#fff8ee;--cream2:#ffe8c0;
  --green:#3dbd52;--green2:#28962f;
  --tx:#fff8ee;--tx2:#ffbf80;--tx3:#b86040;
  --bd:rgba(255,80,0,.12);--bd2:rgba(255,130,0,.22);
  --gr:rgba(255,26,0,.3);--go:rgba(255,85,0,.22);--gy:rgba(255,153,0,.2);--gg:rgba(61,189,82,.15);
  --fd:'Bebas Neue',sans-serif;--fb:'Outfit',sans-serif;--fm:'Space Mono',monospace;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --r:14px;--rs:9px;
}
html,body{height:100%;margin:0}
body{font-family:var(--fb);background:#000;color:var(--tx);overflow-x:clip;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
#app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;width:100%;max-width:430px;background:var(--bg);padding-bottom:calc(80px + var(--sb));padding-top:calc(64px + var(--st))}

/* ── DESKTOP WRAPPER ── */
@media(min-width:500px){
  body{background:radial-gradient(ellipse at center,#1a0300 0%,#000 70%);align-items:flex-start;overflow-y:auto;}
  #app{min-height:100vh;box-shadow:0 0 80px rgba(255,100,0,.12),0 0 200px rgba(0,0,0,.8);border-left:1px solid rgba(255,80,0,.08);border-right:1px solid rgba(255,80,0,.08);}
  .bnav{max-width:430px;}
  .hdr{max-width:430px;}
}

/* ── KEYFRAMES ── */
@keyframes fireShim{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(var(--dy,-14px)) rotate(var(--r2,2deg))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(40px) scale(.95)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-40px) scale(.95)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes zoomIn{from{opacity:0;transform:scale(.7) rotateY(-20deg)}to{opacity:1;transform:scale(1) rotateY(0)}}
@keyframes cardFlip{0%{transform:rotateY(0)}50%{transform:rotateY(-90deg)}100%{transform:rotateY(0)}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes sparkFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--sx),var(--sy)) scale(0);opacity:0}}
@keyframes glow3d{0%,100%{filter:drop-shadow(0 0 12px var(--fire2)) drop-shadow(0 8px 24px rgba(0,0,0,.6))}50%{filter:drop-shadow(0 0 28px var(--fire3)) drop-shadow(0 8px 32px rgba(0,0,0,.8))}}
@keyframes heroParticle{0%{transform:translateY(0) translateX(0) scale(1);opacity:.8}100%{transform:translateY(var(--hy,-120px)) translateX(var(--hx,20px)) scale(0);opacity:0}}
@keyframes stepEnter{0%{opacity:0;transform:translateY(32px) scale(.94) rotateX(8deg)}100%{opacity:1;transform:translateY(0) scale(1) rotateX(0)}}
@keyframes liquidFill{from{transform:scaleY(0) translateY(100%)}to{transform:scaleY(1) translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes countPop{0%{transform:scale(.5) rotateY(-90deg);opacity:0}60%{transform:scale(1.1) rotateY(10deg)}100%{transform:scale(1) rotateY(0);opacity:1}}
@keyframes tickPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes codePop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes smokeRise{0%{transform:translate(var(--sx),0) scale(.25) rotate(var(--sr));opacity:.95}100%{transform:translate(calc(var(--sx) + var(--sdx)),-280px) scale(var(--ss)) rotate(calc(var(--sr)*-1.5));opacity:0}}
@keyframes particleBurst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--px),var(--py)) scale(0);opacity:0}}
@keyframes formulaReveal{0%{opacity:0;transform:translateY(40px) scale(.75)}65%{transform:translateY(-6px) scale(1.05)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes glowPulse{0%,100%{text-shadow:0 0 30px rgba(255,200,0,.7)}50%{text-shadow:0 0 60px rgba(255,255,100,1),0 0 100px rgba(255,150,0,.8)}}
@keyframes nachoSpin{0%{transform:rotateY(0) rotateX(8deg)}100%{transform:rotateY(360deg) rotateX(8deg)}}
@keyframes scanH{0%{top:-5%}100%{top:105%}}

/* ── 3D SCENE BASE ── */
.scene3d{perspective:800px;perspective-origin:50% 40%}
.preserve3d{transform-style:preserve-3d}

/* ── HEADER ── */
.hdr{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:300;padding:calc(var(--st)+10px) 16px 10px;background:rgba(8,0,0,.97);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-bottom:1px solid var(--bd2);display:flex;align-items:center;justify-content:space-between;overflow:hidden}
.hdr::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--fire1),var(--fire3),var(--fire1),transparent)}
.hdr::after{content:'';position:absolute;left:0;width:100%;height:50px;background:linear-gradient(transparent,rgba(255,80,0,.03),transparent);animation:scanH 4s linear infinite;pointer-events:none}
.logo{display:flex;align-items:center;gap:10px}
.logo-gem{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--fire1),var(--fire3));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 0 20px var(--gr),0 4px 16px rgba(0,0,0,.5)}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-n{color:var(--fire3);font-size:10px;font-weight:700;letter-spacing:4px;font-family:var(--fm);text-transform:uppercase}
.logo-l{color:var(--cream);font-size:22px;font-weight:900;font-family:var(--fd);letter-spacing:2px}
.hdr-r{display:flex;gap:7px;align-items:center}
.hcart{background:rgba(255,85,0,.1);border:1px solid var(--bd2);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:6px;font-family:var(--fb);font-size:13px;font-weight:700;color:var(--tx);cursor:pointer;transition:all .2s}
.hcart:active{transform:scale(.93)}
.cpill{background:linear-gradient(135deg,var(--fire1),var(--fire2));color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:800;min-width:17px;text-align:center}
.admin-btn{background:rgba(255,85,0,.06);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;color:var(--tx3);cursor:pointer;font-size:16px;transition:all .2s;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.reg-btn{background:rgba(255,153,0,.1);border:1px solid rgba(255,153,0,.3);border-radius:10px;padding:8px 13px;color:var(--fire4);cursor:pointer;font-size:12px;font-weight:800;letter-spacing:.5px;transition:all .2s;font-family:var(--fm)}
.reg-btn:hover{background:rgba(255,153,0,.18)}

/* ── SCHEDULE BAR ── */
.sched-bar{background:rgba(255,50,0,.06);border-bottom:1px solid var(--bd);padding:7px 20px;display:flex;gap:18px;overflow-x:auto;scrollbar-width:none}
.sched-bar::-webkit-scrollbar{display:none}
.sb-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--tx2);white-space:nowrap;flex-shrink:0;font-family:var(--fm)}
.sb-dot{width:5px;height:5px;border-radius:50%;background:var(--fire2);flex-shrink:0;animation:pulse 2s ease infinite}

/* ── COUNTDOWN STRIP ── */
.countdown-strip{background:linear-gradient(90deg,rgba(255,26,0,.15),rgba(255,153,0,.1),rgba(255,26,0,.15));border-bottom:1px solid rgba(255,153,0,.25);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;position:relative}
.countdown-strip::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,153,0,.05),transparent);animation:fireShim 3s linear infinite}
.cd-left{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cd-label{font-size:9px;font-weight:700;color:rgba(255,200,100,.7);letter-spacing:2px;text-transform:uppercase;font-family:var(--fm)}
.cd-event{font-family:var(--fd);font-size:14px;font-weight:900;color:var(--cream);letter-spacing:1px}
.cd-units{display:flex;gap:5px;align-items:center}
.cd-unit{background:rgba(0,0,0,.5);border:1px solid rgba(255,153,0,.25);border-radius:7px;padding:4px 7px;text-align:center;min-width:42px}
.cd-num{font-family:var(--fd);font-size:20px;font-weight:900;color:var(--fire3);line-height:1;letter-spacing:1px}
.cd-lbl{font-size:8px;color:var(--tx3);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:1px;font-family:var(--fm)}
.cd-sep{font-size:16px;color:var(--fire2);font-weight:900;opacity:.5;animation:pulse 1s ease infinite}
.cd-disc{background:linear-gradient(135deg,rgba(255,153,0,.18),rgba(255,26,0,.12));border:1px solid rgba(255,153,0,.35);border-radius:8px;padding:5px 10px;display:flex;align-items:center;gap:5px;flex-shrink:0}
.cd-disc-pct{font-family:var(--fd);font-size:20px;font-weight:900;color:var(--fire3);letter-spacing:1px}
.cd-disc-txt{font-size:9px;color:var(--tx2);font-weight:700;line-height:1.3;font-family:var(--fm)}

/* ── 3D HERO ── */
.hero3d{position:relative;overflow:hidden;min-height:320px;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid var(--bd2)}
.hero-canvas{position:absolute;inset:0;z-index:0}
.hero-bg-img{width:100%;height:100%;object-fit:cover;filter:brightness(.25) saturate(2) contrast(1.2)}
.hero-gradient{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,0,0,.3) 0%,rgba(8,0,0,.1) 30%,rgba(8,0,0,.85) 75%,rgba(8,0,0,1) 100%)}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,85,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,85,0,.06) 1px,transparent 1px);background-size:40px 40px;transform:perspective(400px) rotateX(35deg);transform-origin:bottom center;opacity:.6}
.hero-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hp{position:absolute;border-radius:50%;animation:heroParticle linear infinite}
.orb3d{position:absolute;border-radius:50%;pointer-events:none;filter:blur(48px)}
.o3d-1{width:200px;height:200px;background:radial-gradient(circle,rgba(255,26,0,.45),transparent 70%);top:-60px;right:-40px;animation:floatY 6s ease-in-out infinite;--dy:-18px}
.o3d-2{width:140px;height:140px;background:radial-gradient(circle,rgba(255,85,0,.35),transparent 70%);bottom:-30px;left:-20px;animation:floatY 8s ease-in-out infinite reverse;--dy:-12px}
.o3d-3{width:90px;height:90px;background:radial-gradient(circle,rgba(255,153,0,.3),transparent 70%);top:35%;right:20%;animation:floatY 5s ease-in-out infinite;--dy:-8px;animation-delay:-2s}

/* Floating 3D nacho elements */
.nacho-float{position:absolute;font-size:var(--sz,28px);animation:floatY var(--dur,7s) ease-in-out infinite;animation-delay:var(--del,0s);filter:drop-shadow(0 8px 16px rgba(0,0,0,.6)) drop-shadow(0 0 12px var(--fire2));transform-origin:center;pointer-events:none;z-index:2}

.hero-content{position:relative;z-index:5;padding:24px 20px 28px}
.hero-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,153,0,.1);border:1px solid rgba(255,153,0,.25);color:var(--fire4);padding:4px 12px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;font-family:var(--fm)}
.hero-title{font-family:var(--fd);font-size:clamp(52px,16vw,88px);font-weight:900;line-height:.88;letter-spacing:2px;margin-bottom:12px}
.hero-t1{display:block;color:var(--cream);text-shadow:0 4px 24px rgba(0,0,0,.8)}
.hero-t2{display:block;background:linear-gradient(90deg,var(--fire1),var(--fire2),var(--fire3),var(--fire4));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:300% auto;animation:fireShim 2.5s linear infinite;filter:drop-shadow(0 0 20px rgba(255,100,0,.4))}
.hero-sub{font-size:14px;color:rgba(255,248,238,.7);line-height:1.6;max-width:320px;margin-bottom:18px;font-weight:500}
.hero-sub strong{color:var(--fire3)}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}

/* ── 3D CTA BUTTON ── */
.btn3d{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:14px;border:none;font-family:var(--fb);font-size:15px;font-weight:800;cursor:pointer;overflow:hidden;transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.btn3d::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 50%);opacity:0;transition:opacity .2s}
.btn3d:hover::before{opacity:1}
.btn3d:active{transform:scale(.93) translateY(2px)!important}
.b-fire3d{background:linear-gradient(135deg,var(--fire1),var(--fire2),var(--fire3));background-size:200% auto;color:#fff;box-shadow:0 8px 32px var(--gr),0 0 0 1px rgba(255,100,0,.3),inset 0 1px 0 rgba(255,255,255,.2);animation:fireShim 2s linear infinite,ctaPulse3d 2.5s ease-in-out infinite}
.b-outline3d{background:transparent;color:var(--tx);border:1.5px solid var(--bd2);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.b-green3d{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;box-shadow:0 6px 20px var(--gg)}
.b-wa3d{background:#25d366;color:#fff;box-shadow:0 6px 20px rgba(37,211,102,.35)}
.b-amber3d{background:linear-gradient(135deg,var(--fire3),var(--fire4));color:#0a0000;font-weight:900;box-shadow:0 6px 24px var(--gy)}
@keyframes ctaPulse3d{0%,100%{box-shadow:0 8px 32px var(--gr),0 0 0 0 rgba(255,100,0,.4),inset 0 1px 0 rgba(255,255,255,.2)}50%{box-shadow:0 12px 40px var(--gr),0 0 0 8px rgba(255,100,0,0),inset 0 1px 0 rgba(255,255,255,.2)}}
.btn3d .rpl{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:ripple .5s ease-out forwards;pointer-events:none}
.btn3d .spk{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;animation:sparkFly .5s ease-out forwards}
.bfull{width:100%}
.btn3d:disabled{opacity:.3;cursor:not-allowed;animation:none!important;transform:none!important}

/* ── FEATURE CHIPS ── */
.fstrip{display:flex;gap:7px;padding:14px 20px 0;overflow-x:auto;scrollbar-width:none}
.fstrip::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;font-family:var(--fm)}
.fc-r{background:rgba(255,26,0,.08);border:1px solid rgba(255,26,0,.25);color:#ff6644}
.fc-o{background:rgba(255,85,0,.08);border:1px solid rgba(255,85,0,.25);color:var(--fire2)}
.fc-y{background:rgba(255,153,0,.08);border:1px solid rgba(255,153,0,.25);color:var(--fire3)}
.fc-g{background:rgba(61,189,82,.08);border:1px solid rgba(61,189,82,.25);color:var(--green)}

/* ── STATS ── */
.stats{display:flex;gap:8px;padding:14px 20px 0;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stp{flex-shrink:0;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;text-align:center;position:relative;overflow:hidden}
.stp::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--fire1),var(--fire3))}
.stp .sv{font-family:var(--fd);font-size:26px;font-weight:900;letter-spacing:1px}
.stp .sl{font-size:9px;color:var(--tx3);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:3px;font-family:var(--fm)}
.sf .sv{color:var(--fire1)}.sw .sv{color:var(--fire3)}.sc .sv{color:var(--green)}

/* ── STEP PILLS ── */
.srow{display:flex;gap:7px;padding:14px 20px 0;overflow-x:auto;scrollbar-width:none}
.srow::-webkit-scrollbar{display:none}
.spill{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--bd);color:var(--tx3);background:var(--bg2);transition:all .2s;font-family:var(--fm)}
.spill.a{border-color:var(--fire3);color:var(--fire3);background:rgba(255,153,0,.08);box-shadow:0 0 12px rgba(255,153,0,.2)}
.spill.d{border-color:rgba(61,189,82,.4);color:var(--green);background:rgba(61,189,82,.06)}

/* ── SECTION HEAD ── */
.sh{padding:20px 20px 0}
.st{font-family:var(--fd);font-size:34px;font-weight:900;color:var(--cream);letter-spacing:1px;line-height:1}
.st .fi{color:var(--fire2)}
.st .gw{background:linear-gradient(90deg,var(--fire2),var(--fire4));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.st .fr{color:var(--green)}
.ss{font-size:13px;color:var(--tx2);margin-top:5px;font-weight:500;font-family:var(--fm)}

/* ── 3D SIZE GRID ── */
.sgrid3d{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px 0}
.szcard{background:var(--bg2);border:1.5px solid var(--bd);border-radius:16px;padding:18px 10px;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);text-align:center;position:relative;overflow:hidden;transform-style:preserve-3d}
.szcard::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.06),transparent 50%);pointer-events:none}
.szcard:active{transform:scale(.93) translateY(3px)}
.szcard.sel{border-color:var(--fire3);box-shadow:0 0 0 3px rgba(255,153,0,.2),0 12px 32px rgba(0,0,0,.5);transform:translateY(-4px) scale(1.02)}
.szcard.sel::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,153,0,.12),rgba(255,26,0,.08));pointer-events:none}
.sz-icon{font-size:30px;margin-bottom:8px;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));transition:transform .3s}
.szcard.sel .sz-icon{animation:floatY 3s ease-in-out infinite;--dy:-6px}
.sz-name{font-family:var(--fd);font-size:20px;font-weight:900;color:var(--cream);letter-spacing:1px}
.sz-price{font-family:var(--fd);font-size:24px;font-weight:900;color:var(--fire3);margin-top:6px;letter-spacing:1px}
.sz-badge{font-size:9px;color:var(--green);margin-top:4px;font-weight:800;letter-spacing:1px;text-transform:uppercase;font-family:var(--fm)}
.sz-includes{margin-top:10px;padding:8px;background:rgba(255,255,255,.03);border-radius:8px;text-align:left}
.sz-inc-item{font-size:10px;color:var(--tx2);font-weight:600;line-height:1.9;font-family:var(--fm)}

/* ── 3D INGREDIENT CARDS ── */
.igrid3d{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:16px 20px 0}
.icard{background:var(--bg2);border:1.5px solid var(--bd);border-radius:16px;padding:18px 12px;cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1);text-align:center;position:relative;overflow:hidden}
.icard::before{content:'';position:absolute;top:0;left:0;right:0;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.04) 0%,transparent 60%);pointer-events:none}
.icard:active{transform:scale(.93) rotateX(4deg)}
.icard.sr{border-color:var(--fire1);box-shadow:0 0 0 3px rgba(255,26,0,.15),0 8px 24px rgba(255,26,0,.12);background:rgba(255,26,0,.04);transform:translateY(-3px)}
.icard.so{border-color:var(--fire2);box-shadow:0 0 0 3px rgba(255,85,0,.15),0 8px 24px rgba(255,85,0,.12);background:rgba(255,85,0,.04);transform:translateY(-3px)}
.icard.sy{border-color:var(--fire3);box-shadow:0 0 0 3px rgba(255,153,0,.15),0 8px 24px rgba(255,153,0,.12);background:rgba(255,153,0,.04);transform:translateY(-3px)}
.icard.sg{border-color:var(--green);box-shadow:0 0 0 3px rgba(61,189,82,.15),0 8px 24px rgba(61,189,82,.1);background:rgba(61,189,82,.04);transform:translateY(-3px)}
.icard.disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
.i-chk{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--fire1),var(--fire3));color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.3) rotate(-180deg);transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.icard.sr .i-chk,.icard.so .i-chk,.icard.sy .i-chk,.icard.sg .i-chk{opacity:1;transform:scale(1) rotate(0)}
.i-emoji{font-size:32px;margin-bottom:10px;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));transition:transform .3s}
.icard.sr .i-emoji,.icard.so .i-emoji,.icard.sy .i-emoji,.icard.sg .i-emoji{animation:floatY 3s ease-in-out infinite;--dy:-5px}
.i-name{font-size:13px;font-weight:700;color:var(--cream);line-height:1.3}
.i-desc{font-size:10px;color:var(--tx2);margin-top:3px;font-family:var(--fm)}
.i-extra{font-size:11px;color:var(--fire3);font-weight:800;margin-top:5px;font-family:var(--fm)}
.heat3d{display:flex;gap:3px;margin-top:7px;justify-content:center}
.hd3d{width:9px;height:9px;border-radius:50%;background:var(--bg4);transition:all .2s}
.hd3d.on{background:linear-gradient(135deg,var(--fire1),var(--fire3));box-shadow:0 0 6px var(--fire2)}

/* ── 3D BUILD PROGRESS ── */
.build-progress{margin:16px 20px 0;background:var(--bg2);border:1px solid var(--bd2);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.build-progress::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,26,0,.04),transparent);pointer-events:none}
.bp-title{font-family:var(--fd);font-size:13px;color:var(--fire3);letter-spacing:3px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.bp-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd2),transparent)}
.bp-layers{display:flex;flex-direction:column;gap:5px;min-height:100px}
.bp-layer{border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:10px;animation:stepEnter .4s cubic-bezier(.34,1.56,.64,1) both;position:relative;overflow:hidden}
.bp-layer::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent)}
.bp-layer .bl-emoji{font-size:18px;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.bp-layer .bl-name{font-size:12px;font-weight:700;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-layer .bl-tag{font-size:9px;font-weight:800;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.3);color:rgba(255,255,255,.9);flex-shrink:0;font-family:var(--fm)}
.bl-size{background:linear-gradient(135deg,#6a0dad,#9b30ff)}
.bl-base{background:linear-gradient(135deg,#8b0000,#cc2200)}
.bl-protein{background:linear-gradient(135deg,#b84000,#ff6600)}
.bl-cheese{background:linear-gradient(135deg,#8b6914,#d4a017)}
.bl-topping{background:linear-gradient(135deg,#1a5c20,#2ea838)}
.bl-salsa{background:linear-gradient(135deg,#8b0020,#cc0030)}
.bl-drink{background:linear-gradient(135deg,#006080,#008db5)}
.bp-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.3;padding:20px 0}
.bp-empty .bei{font-size:36px;margin-bottom:8px}
.bp-empty p{font-size:12px;color:var(--tx3);text-align:center;font-family:var(--fm)}
.bp-bar{margin-top:12px;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
.bp-fill{height:100%;background:linear-gradient(90deg,var(--fire1),var(--fire3),var(--fire4));border-radius:3px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.bp-pct{display:flex;justify-content:space-between;margin-top:5px}
.bp-pct span{font-size:10px;color:var(--tx3);font-weight:600;font-family:var(--fm)}

/* ── TOPPINGS ── */
.tw{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px 0}
.tchip{padding:9px 14px;border-radius:22px;border:1.5px solid var(--bd);background:var(--bg2);color:var(--tx2);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:6px;font-family:var(--fb)}
.tchip:active{transform:scale(.9)}
.tchip.on{border-color:var(--green);color:var(--cream);background:rgba(61,189,82,.08);box-shadow:0 0 12px rgba(61,189,82,.2);transform:scale(1.04)}

/* ── SUMMARY ── */
.sumbox{margin:14px 20px 0;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.sumhdr{padding:12px 16px;background:linear-gradient(90deg,rgba(255,26,0,.18),rgba(255,85,0,.1));border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.sumhdr span{font-size:10px;font-weight:800;color:var(--fire3);letter-spacing:2px;text-transform:uppercase;font-family:var(--fm)}
.sumrow{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--bd)}
.sumrow:last-child{border-bottom:none}
.slb{font-size:12px;color:var(--tx2);font-weight:500;font-family:var(--fm)}
.svl{font-size:13px;color:var(--cream);font-weight:700;text-align:right;max-width:60%}
.stot{padding:14px 16px;background:linear-gradient(90deg,rgba(255,85,0,.1),rgba(255,153,0,.07));display:flex;justify-content:space-between;align-items:center}
.stot .slb{color:var(--cream);font-size:13px;font-weight:800}
.stot .svl{font-family:var(--fd);font-size:34px;color:var(--fire3);-webkit-text-fill-color:var(--fire3);letter-spacing:1px}

/* ── CART ── */
.ci{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 20px 0;display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden}
.ci::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--fire1),var(--fire3))}
.cib{flex:1}.cib h4{font-size:15px;font-weight:700;color:var(--cream);font-family:var(--fd);letter-spacing:.5px}.cib p{font-size:12px;color:var(--tx2);margin-top:4px;line-height:1.5;font-weight:500;font-family:var(--fm)}
.cir{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.cip{font-family:var(--fd);font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--fire2),var(--fire4));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cempty{text-align:center;padding:64px 20px}
.cempty .ei{font-size:60px;margin-bottom:14px}
.cempty h3{font-size:24px;font-weight:900;color:var(--cream);margin-bottom:8px;font-family:var(--fd);letter-spacing:1px}
.cempty p{font-size:14px;color:var(--tx2);margin-bottom:24px;font-weight:500}
.ctot{margin:16px 20px 0;background:linear-gradient(135deg,rgba(255,26,0,.1),rgba(255,85,0,.07));border:1px solid rgba(255,85,0,.2);border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.ctl{font-size:12px;color:var(--tx2);font-weight:600;margin-bottom:2px;font-family:var(--fm)}
.ctotal{font-family:var(--fd);font-size:46px;font-weight:900;background:linear-gradient(135deg,var(--fire1),var(--fire3),var(--fire4));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}

/* ── DISCOUNT FIELD ── */
.disc-field{margin:12px 20px 0;padding:14px 16px;background:var(--bg2);border:1px solid var(--bd);border-radius:14px}
.disc-field-lbl{font-size:10px;font-weight:800;color:var(--tx3);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;font-family:var(--fm)}
.disc-applied{font-size:10px;font-weight:800;color:var(--green);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;font-family:var(--fm)}
.disc-input-row{display:flex;gap:8px}
.disc-input{flex:1;background:var(--bg3);border:1.5px solid var(--bd2);border-radius:10px;padding:10px 14px;color:var(--cream);font-family:var(--fm);font-size:14px;font-weight:700;outline:none;text-transform:uppercase;letter-spacing:2px}
.disc-input:focus{border-color:var(--fire3)}
.disc-applied-box{display:flex;align-items:center;justify-content:space-between}
.disc-code-show{font-family:var(--fd);font-size:20px;font-weight:900;color:var(--fire3);letter-spacing:2px}
.disc-save{font-size:12px;color:var(--green);font-weight:700;margin-top:2px;font-family:var(--fm)}

/* ── PAYMENTS ── */
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 20px 0}
.pcard{background:var(--bg2);border:1.5px solid var(--bd);border-radius:14px;padding:18px 12px;cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1);text-align:center}
.pcard:active{transform:scale(.93)}
.pcard.sel{border-color:var(--fire3);background:rgba(255,153,0,.07);box-shadow:0 0 0 3px rgba(255,153,0,.15),0 8px 24px rgba(0,0,0,.4);transform:scale(1.02)}
.pi{font-size:30px;margin-bottom:7px}
.pn{font-size:14px;font-weight:700;color:var(--cream)}
.pd{font-size:11px;color:var(--tx2);margin-top:2px;font-weight:500;font-family:var(--fm)}

/* ── INPUTS ── */
.ig{margin-bottom:14px}
.ig label{display:block;font-size:10px;font-weight:700;color:var(--tx3);margin-bottom:6px;letter-spacing:1.5px;text-transform:uppercase;font-family:var(--fm)}
.ig input,.ig select,.ig textarea{width:100%;background:var(--bg3);border:1.5px solid var(--bd2);border-radius:12px;padding:13px 16px;color:var(--cream);font-family:var(--fb);font-size:15px;font-weight:600;outline:none;transition:border-color .2s;-webkit-appearance:none}
.ig input:focus,.ig select:focus,.ig textarea:focus{border-color:var(--fire3);box-shadow:0 0 0 3px rgba(255,153,0,.12)}
.ig textarea{resize:vertical;min-height:70px}
.ir{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── TRACKER ── */
.tks{display:flex;flex-direction:column}
.tk{display:flex;gap:16px}
.tl{display:flex;flex-direction:column;align-items:center}
.td{width:42px;height:42px;border-radius:50%;border:2px solid var(--bd2);background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all .3s}
.td.dn{border-color:var(--green);background:rgba(61,189,82,.1)}
.td.ac{border-color:var(--fire3);background:rgba(255,153,0,.1);box-shadow:0 0 16px rgba(255,153,0,.3)}
.tc2{width:2px;flex:1;background:var(--bd);margin:4px 0;min-height:28px;transition:background .4s}
.tc2.dn{background:linear-gradient(180deg,var(--green),var(--green2))}
.ti{padding:2px 0 26px}.ti h4{font-size:15px;font-weight:700}.ti p{font-size:13px;color:var(--tx2);margin-top:2px;font-weight:500;font-family:var(--fm)}
.tt{font-size:11px;color:var(--fire3);margin-top:4px;font-weight:700;font-family:var(--fm)}
.wabox{background:rgba(61,189,82,.05);border:1px solid rgba(61,189,82,.2);border-radius:14px;padding:16px;margin-top:20px}
.wabox p{font-size:13px;color:var(--tx2);margin-bottom:10px;font-weight:500}

/* ── EVENTS ── */
.egrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 20px 0}
.ev{background:var(--bg2);border:1.5px solid var(--bd);border-radius:14px;padding:18px 14px;cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.ev:active{transform:scale(.93)}
.ev.sel{border-color:var(--fire2);background:rgba(255,85,0,.06);box-shadow:0 0 0 3px rgba(255,85,0,.15);transform:scale(1.02)}
.evi{font-size:30px;margin-bottom:9px}
.evn{font-size:13px;font-weight:700;color:var(--cream);line-height:1.3}
.evm{font-size:11px;color:var(--tx2);margin-top:3px;font-weight:500;font-family:var(--fm)}
.evp{font-size:15px;color:var(--fire3);font-weight:800;margin-top:6px;font-family:var(--fd);letter-spacing:1px}
.succ{text-align:center;padding:60px 24px;animation:fadeUp .5s ease}
.succ .si{font-size:64px;margin-bottom:16px}
.succ h2{font-family:var(--fd);font-size:42px;font-weight:900;background:linear-gradient(135deg,var(--fire1),var(--fire3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:2px}
.succ p{font-size:14px;color:var(--tx2);max-width:300px;margin:0 auto 24px;line-height:1.6;font-weight:500}

/* ── SPECIAL + PROMOS ── */
.special-card{margin:14px 20px 0;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(135deg,rgba(100,0,50,.5),rgba(180,30,0,.35),rgba(255,110,0,.18));border:1.5px solid rgba(255,170,0,.4)}
.special-hdr{background:linear-gradient(90deg,rgba(255,26,0,.2),rgba(255,153,0,.12));padding:7px 14px;display:flex;align-items:center;gap:7px;border-bottom:1px solid rgba(255,153,0,.18)}
.special-hdr span{font-size:9px;font-weight:800;color:var(--fire4);letter-spacing:2px;text-transform:uppercase;font-family:var(--fm)}
.special-body{padding:12px 14px;display:flex;align-items:center;gap:12px}
.special-emoji{font-size:40px;flex-shrink:0;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.special-info{flex:1;min-width:0}
.special-sci{font-size:10px;color:rgba(255,210,120,.6);font-weight:700;font-style:italic;margin-bottom:2px;font-family:var(--fm)}
.special-name{font-family:var(--fd);font-size:16px;font-weight:900;color:var(--cream);line-height:1.2;letter-spacing:.5px}
.special-desc{font-size:11px;color:var(--tx2);margin-top:3px;font-weight:500;line-height:1.4}
.special-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.special-price{font-family:var(--fd);font-size:24px;font-weight:900;color:var(--fire3);letter-spacing:1px}

.promos-row{margin-top:14px}
.promos-hdr{padding:0 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.promos-hdr-t{font-family:var(--fd);font-size:18px;font-weight:900;color:var(--cream);letter-spacing:1px}
.promos-hdr-c{font-size:10px;color:var(--tx3);font-weight:700;font-family:var(--fm)}
.promos-scroll{display:flex;gap:10px;padding:0 20px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.promos-scroll::-webkit-scrollbar{display:none}
.pcard3d{flex-shrink:0;width:165px;background:var(--bg2);border:1.5px solid var(--bd);border-radius:16px;padding:14px 12px;cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.pcard3d:active{transform:scale(.93)}
.pcard3d::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--fire1),var(--fire3))}
.pcard3d:hover{border-color:var(--fire3);transform:translateY(-3px)}
.pc-emoji{font-size:28px;margin-bottom:8px;line-height:1}
.pc-title{font-family:var(--fd);font-size:14px;font-weight:900;color:var(--cream);line-height:1.2;margin-bottom:3px;letter-spacing:.5px}
.pc-desc{font-size:10px;color:var(--tx2);font-weight:500;line-height:1.4;margin-bottom:9px;font-family:var(--fm)}
.pc-bottom{display:flex;align-items:center;justify-content:space-between}
.pc-price{font-family:var(--fd);font-size:22px;font-weight:900;color:var(--fire3);letter-spacing:1px}
.pc-badge{background:linear-gradient(135deg,var(--fire1),var(--fire2));color:#fff;font-size:8px;font-weight:800;padding:2px 7px;border-radius:8px;white-space:nowrap;letter-spacing:.5px;font-family:var(--fm)}

/* ── PROTEIN RULE HINT ── */
.prhint{margin:10px 20px 0;padding:10px 14px;background:rgba(255,153,0,.06);border:1px solid rgba(255,153,0,.18);border-radius:10px;display:flex;align-items:center;gap:10px}
.prhint-icon{font-size:18px;flex-shrink:0}
.prhint p{font-size:12px;color:var(--tx2);font-weight:600;line-height:1.4;font-family:var(--fm)}
.prhint strong{color:var(--fire3)}
.pcounter{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 0}
.pcounter-lbl{font-size:11px;color:var(--tx3);font-weight:700;font-family:var(--fm)}
.pcdots{display:flex;gap:4px}
.pcdot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd2);background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.pcdot.filled{background:linear-gradient(135deg,var(--fire1),var(--fire3));border-color:var(--fire3);color:#fff;font-weight:800;box-shadow:0 0 10px rgba(255,153,0,.4);transform:scale(1.1)}
.pcdot.extra{background:rgba(255,153,0,.12);border-color:rgba(255,153,0,.35);color:var(--fire3)}

/* ── DRINKS GRID ── */
.dkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:16px 20px 0}
.dkcard{background:var(--bg2);border:1.5px solid var(--bd);border-radius:16px;padding:16px 12px;cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1);text-align:center;position:relative;overflow:hidden}
.dkcard:active{transform:scale(.93)}
.dkcard.sel{border-color:#00bcd4;box-shadow:0 0 0 3px rgba(0,188,212,.12),0 8px 24px rgba(0,0,0,.3);background:rgba(0,188,212,.04);transform:translateY(-3px)}
.dkcard .i-chk{background:linear-gradient(135deg,#00acc1,#00bcd4)}
.dk-qty{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:9px}
.dk-qty button{background:rgba(0,188,212,.12);border:1px solid rgba(0,188,212,.25);color:#00e5ff;border-radius:50%;width:28px;height:28px;font-size:17px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:var(--fb);line-height:1}
.dk-qty button:active{transform:scale(.88)}
.dk-qty span{font-family:var(--fd);font-size:20px;color:var(--cream);font-weight:900;min-width:22px;text-align:center;letter-spacing:1px}
.dk-price{font-size:14px;color:#00e5ff;font-weight:800;margin-top:5px;font-family:var(--fd);letter-spacing:1px}

/* ── EXPLOSION ── */
.exp-overlay{position:fixed;inset:0;z-index:9999;background:rgba(4,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.exp-scene{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%}
.smoke-puff{position:absolute;border-radius:50%;animation:smokeRise linear forwards}
.exp-particle{position:absolute;border-radius:50%;animation:particleBurst .9s ease-out forwards}
.exp-beaker{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);filter:drop-shadow(0 0 32px rgba(255,150,0,.8))}
.exp-text{position:relative;z-index:10;text-align:center;display:flex;flex-direction:column;align-items:center;padding:0 24px}
.exp-label{font-size:10px;font-weight:800;letter-spacing:3px;color:rgba(255,200,100,.6);text-transform:uppercase;margin-bottom:8px;animation:formulaReveal .4s .5s ease both;opacity:0;font-family:var(--fm)}
.exp-title{font-family:var(--fd);font-size:clamp(36px,10vw,60px);font-weight:900;line-height:.88;animation:glowPulse 1.5s ease-in-out infinite,formulaReveal .5s .6s ease both;opacity:0;letter-spacing:2px;text-shadow:0 0 40px rgba(255,100,0,.8)}
.exp-t1{display:block;color:#fff}
.exp-t2{display:block;background:linear-gradient(90deg,#ff5500,#ffcc00,#ff5500);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:fireShim 1.5s linear infinite}
.exp-body{font-size:14px;color:rgba(255,248,220,.8);margin-top:14px;line-height:1.6;max-width:260px;font-weight:500;animation:formulaReveal .5s .85s ease both;opacity:0}
.exp-cta{margin-top:22px;animation:formulaReveal .5s 1.1s ease both;opacity:0;text-align:center}
.exp-cta-text{font-size:15px;font-weight:800;color:#ffcc00;animation:pulse 1.2s ease infinite;font-family:var(--fm)}
.exp-skip{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,248,220,.4);font-size:12px;font-weight:700;padding:8px 20px;border-radius:20px;cursor:pointer;font-family:var(--fm);letter-spacing:1px}

/* ── MODAL / ADMIN ── */
.modal-bg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg2);border:1px solid var(--bd2);border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:94vh;overflow-y:auto;padding-bottom:calc(24px + var(--sb));scroll-behavior:smooth}
.modal-handle{width:36px;height:4px;background:var(--bd2);border-radius:2px;margin:12px auto 0}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);z-index:10}
.modal-title{font-family:var(--fd);font-size:24px;font-weight:900;letter-spacing:1px}
.modal-title .fi{color:var(--fire2)}
.modal-title .gw{background:linear-gradient(90deg,var(--fire3),var(--fire4));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.modal-close{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;font-size:16px;cursor:pointer;color:var(--tx2);transition:all .2s}
.modal-body{padding:16px 20px 0}
.admin-lock{text-align:center;padding:36px 20px}
.admin-lock .li{font-size:48px;margin-bottom:12px}
.admin-lock h2{font-family:var(--fd);font-size:28px;color:var(--cream);margin-bottom:6px;letter-spacing:1px}
.admin-lock p{font-size:13px;color:var(--tx2);margin-bottom:22px;font-weight:500}
.admin-sec{margin-bottom:24px}
.admin-sec>h3{font-family:var(--fd);font-size:19px;font-weight:900;color:var(--cream);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;letter-spacing:.5px}
.admin-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.admin-tabs::-webkit-scrollbar{display:none}
.atab{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--bd);color:var(--tx3);background:var(--bg3);transition:all .15s;font-family:var(--fm);letter-spacing:.5px}
.atab.on{border-color:var(--fire3);color:var(--fire3);background:rgba(255,153,0,.08)}
.prod-list{display:flex;flex-direction:column;gap:8px}
.prod-item{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.prod-item .pe{font-size:22px;flex-shrink:0}
.prod-item .pi2{flex:1;min-width:0}
.prod-item .pn2{font-size:13px;font-weight:700;color:var(--cream)}
.prod-item .ps{font-size:11px;color:var(--tx2);margin-top:2px;font-weight:500;font-family:var(--fm)}
.prod-actions{display:flex;gap:6px;align-items:center}
.price-chip{background:var(--bg4);border:1px solid var(--bd2);border-radius:8px;padding:4px 10px;color:var(--fire3);font-family:var(--fd);font-size:16px;font-weight:900;width:68px;text-align:center;outline:none;letter-spacing:.5px}
.price-chip:focus{border-color:var(--fire3)}
.add-form{background:var(--bg3);border:1px solid var(--bd2);border-radius:12px;padding:14px;margin-top:12px}
.add-form h4{font-size:12px;font-weight:800;color:var(--fire3);margin-bottom:12px;letter-spacing:1px;text-transform:uppercase;font-family:var(--fm)}
.emoji-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ep{font-size:22px;cursor:pointer;padding:4px 6px;border-radius:8px;border:1.5px solid transparent;transition:all .15s}
.ep.sel{border-color:var(--fire3);background:rgba(255,153,0,.1)}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:var(--bg4);border-radius:12px;cursor:pointer;transition:background .2s;border:1px solid var(--bd2)}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;background:#555;border-radius:50%;transition:all .2s}
.toggle input:checked+.toggle-slider{background:var(--green);border-color:var(--green)}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px);background:#fff}
.color-row{display:flex;gap:12px;flex-wrap:wrap}
.color-swatch{display:flex;flex-direction:column;align-items:center;gap:6px}
.color-swatch label{font-size:10px;color:var(--tx3);font-weight:700;text-align:center;letter-spacing:.5px;font-family:var(--fm)}
.color-swatch input[type=color]{width:52px;height:52px;border:2px solid var(--bd2);border-radius:10px;cursor:pointer;background:none;padding:2px;-webkit-appearance:none}
.color-swatch input[type=color]::-webkit-color-swatch-wrapper{padding:0;border-radius:8px}
.color-swatch input[type=color]::-webkit-color-swatch{border:none;border-radius:7px}

/* ── REG SCREEN ── */
.reg-screen{position:fixed;inset:0;z-index:600;background:rgba(4,0,0,.98);overflow-y:auto}
.reg-inner{max-width:480px;margin:0 auto;padding:calc(var(--st)+20px) 24px calc(80px + var(--sb))}
.reg-close{position:absolute;top:calc(var(--st)+16px);right:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);font-size:16px;padding:7px 11px;border-radius:8px;cursor:pointer;font-family:var(--fm);transition:all .2s}
.reg-close:hover{color:var(--fire3);border-color:var(--fire3)}
.reg-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,153,0,.1);border:1px solid rgba(255,153,0,.25);color:var(--fire4);padding:5px 14px;border-radius:20px;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;font-family:var(--fm)}
.reg-title{font-family:var(--fd);font-size:clamp(42px,12vw,60px);font-weight:900;line-height:.88;margin-bottom:12px;letter-spacing:2px}
.reg-t1{display:block;color:var(--cream)}
.reg-t2{display:block;background:linear-gradient(90deg,var(--fire1),var(--fire2),var(--fire3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% auto;animation:fireShim 2s linear infinite}
.reg-sub{font-size:14px;color:var(--tx2);line-height:1.6;margin-bottom:20px;font-weight:500}
.reg-sub strong{color:var(--fire3)}
.reg-benefits{display:flex;flex-direction:column;gap:9px;margin-bottom:22px;background:rgba(255,153,0,.04);border:1px solid rgba(255,153,0,.12);border-radius:14px;padding:16px}
.reg-benefit{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);font-weight:600}
.reg-benefit .rb-icon{font-size:18px;flex-shrink:0}
.reg-benefit strong{color:var(--cream)}
.code-reveal{background:linear-gradient(135deg,rgba(255,153,0,.08),rgba(255,26,0,.06));border:2px solid rgba(255,153,0,.35);border-radius:16px;padding:24px;text-align:center;animation:codePop .5s cubic-bezier(.34,1.56,.64,1) both;position:relative;overflow:hidden}
.code-reveal-label{font-size:9px;font-weight:800;color:var(--tx3);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-family:var(--fm)}
.code-reveal-code{font-family:var(--fd);font-size:clamp(30px,9vw,46px);font-weight:900;color:var(--fire3);letter-spacing:4px;margin-bottom:6px;text-shadow:0 0 30px rgba(255,153,0,.4)}
.code-reveal-disc{font-size:13px;color:var(--tx2);font-weight:600;margin-bottom:16px}
.code-reveal-disc strong{color:var(--cream)}
.code-copy-btn{background:rgba(255,153,0,.1);border:1px solid rgba(255,153,0,.3);color:var(--fire3);font-family:var(--fm);font-size:11px;font-weight:800;padding:8px 18px;border-radius:8px;cursor:pointer;transition:all .2s;letter-spacing:1px}
.code-note{font-size:11px;color:var(--tx3);margin-top:10px;font-weight:600;line-height:1.5;font-family:var(--fm)}
.reg-countdown{background:rgba(0,0,0,.3);border:1px solid rgba(255,153,0,.15);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-top:12px}
.reg-cd-icon{font-size:24px;flex-shrink:0}
.reg-cd-text{flex:1}
.reg-cd-title{font-size:13px;font-weight:700;color:var(--cream)}
.reg-cd-sub{font-size:11px;color:var(--tx3);margin-top:2px;font-weight:600;font-family:var(--fm)}
.vip-badge-big{background:linear-gradient(135deg,rgba(255,170,0,.15),rgba(255,50,0,.1));border:1.5px solid rgba(255,170,0,.4);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.vip-badge-big .vt{font-family:var(--fd);font-size:18px;font-weight:900;color:var(--fire3);letter-spacing:1px;margin-bottom:6px}
.vip-badge-big .vs{font-size:12px;color:var(--tx2);font-weight:600;line-height:1.7;font-family:var(--fm)}

/* ── REG TABLE ── */
.reg-stats-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.reg-stat{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;flex:1;min-width:70px;text-align:center}
.reg-stat .rsv{font-family:var(--fd);font-size:30px;font-weight:900;color:var(--fire3);letter-spacing:1px}
.reg-stat .rsl{font-size:9px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:2px;font-family:var(--fm)}
.reg-table{display:flex;flex-direction:column;gap:8px}
.reg-row{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.reg-row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.reg-row-name{font-size:14px;font-weight:700;color:var(--cream)}
.reg-row-code{font-family:var(--fd);font-size:13px;color:var(--fire3);font-weight:900;letter-spacing:1px;background:rgba(255,153,0,.08);padding:3px 8px;border-radius:6px}
.reg-row-meta{font-size:11px;color:var(--tx3);margin-top:3px;font-weight:500;font-family:var(--fm)}
.reg-row-used{font-size:9px;font-weight:800;padding:2px 8px;border-radius:6px;flex-shrink:0;font-family:var(--fm);letter-spacing:.5px}
.reg-used-yes{background:rgba(61,189,82,.12);color:var(--green);border:1px solid rgba(61,189,82,.25)}
.reg-used-no{background:rgba(255,153,0,.08);color:var(--fire3);border:1px solid rgba(255,153,0,.25)}

/* ── PRELAUNCH ── */
.prelaunch{padding:28px 20px;text-align:center}
.prelaunch-emoji{font-size:68px;margin-bottom:18px;display:block;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6))}
.prelaunch-title{font-family:var(--fd);font-size:clamp(36px,11vw,52px);font-weight:900;color:var(--cream);margin-bottom:10px;line-height:1;letter-spacing:2px}
.prelaunch-title span{background:linear-gradient(90deg,var(--fire1),var(--fire3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.prelaunch-sub{font-size:14px;color:var(--tx2);margin-bottom:24px;line-height:1.6;font-weight:500;max-width:300px;margin-left:auto;margin-right:auto}
.prelaunch-cd{display:flex;gap:10px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
.pcd-unit{background:var(--bg2);border:1.5px solid var(--bd2);border-radius:14px;padding:16px 12px;min-width:76px;text-align:center;position:relative;overflow:hidden}
.pcd-unit::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--fire1),var(--fire3))}
.pcd-num{font-family:var(--fd);font-size:38px;font-weight:900;color:var(--fire3);line-height:1;letter-spacing:1px}
.pcd-lbl{font-size:9px;color:var(--tx3);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-top:5px;font-family:var(--fm)}

/* ── INSTALL BAR ── */
.ibar{margin:14px 20px 0;background:rgba(255,85,0,.07);border:1px solid rgba(255,85,0,.18);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.ibar .ii{font-size:28px;flex-shrink:0}
.ibar h4{font-size:13px;font-weight:700;color:var(--cream)}
.ibar p{font-size:11px;color:var(--tx2);margin-top:2px;font-weight:500;font-family:var(--fm)}
.ibar button{background:linear-gradient(135deg,var(--fire1),var(--fire3));color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:800;cursor:pointer;font-family:var(--fm);flex-shrink:0;white-space:nowrap;transition:all .2s;letter-spacing:.5px}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(84px + var(--sb));left:50%;transform:translateX(-50%) translateY(20px);padding:11px 22px;border-radius:10px;font-size:13px;font-weight:700;z-index:999;transition:all .3s;opacity:0;pointer-events:none;white-space:nowrap;font-family:var(--fm);letter-spacing:.5px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{background:rgba(10,30,10,.97);border:1px solid rgba(61,189,82,.4);color:var(--green)}
.toast.err{background:rgba(30,0,0,.97);border:1px solid rgba(255,26,0,.4);color:var(--fire1)}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:200;background:rgba(6,0,0,.99);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border-top:1px solid var(--bd2);display:flex;padding:6px 0 calc(6px + var(--sb));width:100%;max-width:430px}
.nb{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;cursor:pointer;font-family:var(--fm);font-size:10px;font-weight:700;color:var(--tx3);transition:color .2s;letter-spacing:.5px;text-transform:uppercase;position:relative;min-height:44px;justify-content:center}
.nb .bi{font-size:20px;line-height:1;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.nb.on{color:var(--fire3)}
.nb.on .bi{transform:scale(1.22) translateY(-2px)}
.nb.on::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:linear-gradient(90deg,var(--fire1),var(--fire3));border-radius:0 0 3px 3px}
.nbadge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--fire1);color:#fff;border-radius:8px;padding:1px 5px;font-size:9px;font-weight:800;min-width:14px;text-align:center}

/* ── FOOD BANNER ── */
.food-banner{margin:14px 20px 0;border-radius:16px;overflow:hidden;position:relative;height:155px;border:1px solid var(--bd2)}
.food-banner img{width:100%;height:100%;object-fit:cover;filter:brightness(.45) saturate(1.8) contrast(1.15)}
.food-banner-ov{position:absolute;inset:0;background:linear-gradient(135deg,rgba(150,0,0,.65),rgba(255,85,0,.3));display:flex;align-items:center;padding:22px}
.food-banner-text h3{font-family:var(--fd);font-size:24px;font-weight:900;color:#fff;line-height:1;letter-spacing:1px}
.food-banner-text p{font-size:12px;color:rgba(255,248,238,.75);margin-top:5px;font-weight:600;font-family:var(--fm)}

.note{font-size:11px;color:var(--tx3);text-align:center;padding:8px 20px;line-height:1.5;font-weight:500;font-family:var(--fm)}
.btn-row{display:flex;gap:10px;padding:16px 20px 0;flex-wrap:wrap}
.btn-row .btn3d{flex:1;min-width:120px}
.scr{animation:fadeUp .35s ease}
.pt{padding-top:20px}
@media(min-width:500px){.igrid3d{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.egrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
  
@keyframes portalIn{0%{opacity:0;transform:scale(.85) translateY(20px);filter:blur(8px)}70%{transform:scale(1.03) translateY(-4px)}100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}}
@keyframes ingredientDrop{0%{transform:translateY(-60px) scale(0) rotate(-180deg);opacity:0}55%{transform:translateY(6px) scale(1.1) rotate(8deg);opacity:1}75%{transform:translateY(-4px) scale(.97) rotate(-2deg)}100%{transform:translateY(0) scale(1) rotate(0);opacity:1}}
@keyframes particleBurst3{0%{transform:translate(0,0) scale(1.5);opacity:1}100%{transform:translate(var(--px),var(--py)) scale(0);opacity:0}}
@keyframes glowRing{0%{box-shadow:0 0 0 0 var(--ring-color,rgba(255,153,0,.6))}100%{box-shadow:0 0 0 20px transparent}}
@keyframes sizzle{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(.92) rotate(-2deg)}75%{transform:scale(1.08) rotate(2deg)}}
@keyframes bubbleFloat2{0%{transform:translateY(0) translateX(var(--bx,0px)) scale(1);opacity:.6}100%{transform:translateY(-100px) translateX(calc(var(--bx,0px)*0.99)) scale(.2);opacity:0}}
@keyframes shimmerSlide{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes beakerGlowPulse{0%,100%{filter:drop-shadow(0 0 20px rgba(255,102,0,.4)) drop-shadow(0 20px 40px rgba(0,0,0,.6))}50%{filter:drop-shadow(0 0 40px rgba(255,153,0,.7)) drop-shadow(0 20px 50px rgba(0,0,0,.7))}}
@keyframes layerDrop{0%{opacity:0;transform:translateY(-30px) scale(.8)}60%{transform:translateY(4px) scale(1.05)}100%{opacity:1;transform:translateY(0) scale(1)}}

.step-wow{animation:portalIn .4s cubic-bezier(.34,1.56,.64,1) both}
.beaker-stage-wow{display:flex;align-items:center;gap:12px;padding:8px 20px;width:100%;box-sizing:border-box;background:rgba(10,2,0,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bd2);position:sticky;top:calc(64px + var(--st));z-index:140}
.beaker-wrap-wow{width:60px;height:88px;flex-shrink:0;position:relative;animation:beakerGlowPulse 3s ease-in-out infinite}
.beaker-layers-wow{display:flex;flex-wrap:wrap;gap:3px;flex:1}
.blp-wow{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:50px;animation:layerDrop .4s cubic-bezier(.34,1.56,.64,1) both;position:relative;overflow:hidden}
.blp-wow::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.1),transparent);pointer-events:none}
.blp-icon{font-size:18px;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.blp-name{font-size:12px;font-weight:700;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blp-tag{font-size:9px;font-weight:800;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.3);color:rgba(255,255,255,.9);flex-shrink:0;font-family:var(--fm,monospace)}
.blp-size{background:linear-gradient(135deg,#6a0dad,#9c27b0)}
.blp-base{background:linear-gradient(135deg,#8b0000,#cc2200)}
.blp-protein{background:linear-gradient(135deg,#b84000,#ff6600)}
.blp-cheese{background:linear-gradient(135deg,#8b6914,#d4a017)}
.blp-topping{background:linear-gradient(135deg,#1a5c20,#2ea838)}
.blp-salsa{background:linear-gradient(135deg,#8b0020,#cc0030)}
.blp-drink{background:linear-gradient(135deg,#006080,#00bcd4)}
.bpct-bar{width:100%;max-width:340px;margin-top:10px;display:flex;align-items:center;gap:10px}
.bpct-track{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.bpct-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--fire1),var(--fire3),var(--fire4));background-size:200% auto;animation:shimmerSlide 2s linear infinite;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.bpct-lbl{font-size:11px;font-weight:800;color:var(--fire3);min-width:36px;text-align:right;font-family:var(--fm,monospace)}
.wow-card{background:var(--bg2);border:2px solid var(--bd);border-radius:18px;padding:18px 12px 14px;cursor:pointer;overflow:hidden;transition:border-color .2s,transform .2s;position:relative;text-align:center}
.wow-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.05),transparent);pointer-events:none}
.wow-card:active{transform:scale(.9)}
.wow-card.wsel-sr{border-color:var(--fire1);background:rgba(255,26,0,.06);transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 0 3px rgba(255,26,0,.2)}

@keyframes beakerShake{0%,100%{transform:rotate(0) translateY(0)}15%{transform:rotate(-7deg) translateY(-5px)}30%{transform:rotate(7deg) translateY(-10px)}45%{transform:rotate(-5deg) translateY(-6px)}60%{transform:rotate(6deg) translateY(-11px)}75%{transform:rotate(-3deg) translateY(-4px)}90%{transform:rotate(3deg) translateY(-2px)}}

/* ── FORMULA COMPLETE ANIMATION — EPIC ── */
@keyframes flaskShake{
  0%,100%{transform:rotate(0deg) scale(1)}
  10%{transform:rotate(-8deg) scale(1.1)}
  20%{transform:rotate(8deg) scale(1.15)}
  30%{transform:rotate(-6deg) scale(1.2)}
  40%{transform:rotate(6deg) scale(1.25)}
  50%{transform:rotate(-4deg) scale(1.3)}
  60%{transform:rotate(3deg) scale(1.25)}
  70%{transform:rotate(-2deg) scale(1.2)}
  80%{transform:rotate(1deg) scale(1.15)}
  90%{transform:rotate(0deg) scale(1.1)}
}
@keyframes flaskGlow{
  0%{filter:drop-shadow(0 0 8px rgba(255,107,26,.3))}
  50%{filter:drop-shadow(0 0 40px rgba(255,107,26,.8)) drop-shadow(0 0 80px rgba(255,60,0,.5))}
  100%{filter:drop-shadow(0 0 8px rgba(255,107,26,.3))}
}
@keyframes particleBurst{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
}
@keyframes liquidRise{0%{transform:translateY(105%)}42%{transform:translateY(-2%)}58%{transform:translateY(-2%)}100%{transform:translateY(-115%)}}
@keyframes waveSlide{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes lwBubble{0%{transform:translateY(0) scale(1);opacity:.85}100%{transform:translateY(-130px) scale(.15);opacity:0}}
@keyframes ringExpand{
  0%{transform:scale(0);opacity:1;border-width:4px}
  100%{transform:scale(3);opacity:0;border-width:1px}
}
@keyframes titleSlam{
  0%{transform:scale(3) translateY(-30px);opacity:0;filter:blur(10px)}
  60%{transform:scale(.95) translateY(3px);opacity:1;filter:blur(0)}
  80%{transform:scale(1.03)}
  100%{transform:scale(1);opacity:1}
}
@keyframes subtitleFade{
  0%{opacity:0;transform:translateY(15px)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes sparkle{
  0%,100%{opacity:0;transform:scale(0) rotate(0deg)}
  50%{opacity:1;transform:scale(1) rotate(180deg)}
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}
.formula-complete-overlay{
  position:fixed;inset:0;z-index:8000;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(40,10,0,.97) 0%,rgba(4,0,0,.99) 70%);
  animation:fadeUp .2s ease;
  padding:24px;
  overflow:hidden;
  cursor:pointer;
}
.fco-flask{
  font-size:100px;
  animation:flaskShake .8s cubic-bezier(.36,.07,.19,.97) both,flaskGlow 1.5s ease .6s infinite;
  position:relative;z-index:2;
}
.fco-ring{
  position:absolute;top:50%;left:50%;
  width:80px;height:80px;margin:-40px 0 0 -40px;

}

function useCountdown(target){
  const[diff,setDiff]=useState(()=>Math.max(0,target-Date.now()));
  useEffect(()=>{const t=setInterval(()=>setDiff(Math.max(0,target-Date.now())),1000);return()=>clearInterval(t);},[target]);
  const d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
  return{d,h,m,s,done:diff===0};
}

const pc=(sz,prList,rules,tops=[],cheese=null)=>{

  const proteins=Array.isArray(prList)?prList:[prList].filter(Boolean);

  const premExtra=premTops.reduce((s,t)=>s+(t.extra||0.99),0);

  return base+(overCount*rule.extraPrice)+premExtra+cheeseExtra;
};

/* ── 3D BUILD PROGRESS ── */
function BuildProgress({build,maxSteps,cartDrinks=[]}){
  const layers=[];
  if(build.size)    layers.push({emoji:build.size.bkr||"🧪",name:build.size.name,cls:"bl-size",tag:`$${build.size.price}`});
  if(build.base)    layers.push({emoji:build.base.emoji,name:build.base.name,cls:"bl-base",tag:"base"});
  if(build.proteins?.length>0) layers.push({emoji:build.proteins[0].emoji,name:build.proteins.map(p=>p.name).join(", "),cls:"bl-protein",tag:`×${build.proteins.length}`});
  if(build.cheese)  layers.push({emoji:build.cheese.emoji,name:build.cheese.name,cls:"bl-cheese",tag:"queso"});
  if(build.toppings.length>0) layers.push({emoji:"🌿",name:`${build.toppings.length} topping${build.toppings.length!==1?"s":""}`,cls:"bl-topping",tag:`×${build.toppings.length}`});
  if(build.salsa)   layers.push({emoji:build.salsa.emoji,name:build.salsa.name,cls:"bl-salsa",tag:"salsa"});
  if(cartDrinks.length>0) layers.push({emoji:"🥤",name:`${cartDrinks.length} bebida${cartDrinks.length!==1?"s":""}`,cls:"bl-drink",tag:`$${cartDrinks.reduce((s,d)=>s+Number(d.price),0).toFixed(2)}`});
  const pct=Math.round((layers.length/maxSteps)*100);
  return(
    <div className="build-progress">
      <div className="bp-title">🧬 FÓRMULA EN CONSTRUCCIÓN</div>
      <div className="bp-layers">
        {layers.length===0
          ?<div className="bp-empty"><div className="bei">🧪</div><p>Selecciona ingredientes<br/>para construir tu fórmula</p></div>
          :layers.map((l,i)=>(
            <div key={i} className={`bp-layer ${l.cls}`} style={{animationDelay:`${i*.05}s`}}>
              <span className="bl-emoji">{l.emoji}</span>
              <span className="bl-name">{l.name}</span>
              <span className="bl-tag">{l.tag}</span>
            </div>
          ))
        }
      </div>
      <div className="bp-bar"><div className="bp-fill" style={{width:pct+"%"}}/></div>
      <div className="bp-pct">
        <span>{layers.length}/{maxSteps} ingredientes</span>
        <span style={{color:pct>=100?"var(--green)":"var(--fire3)"}}>{pct>=100?"✅ LISTA":"⚗️ "+pct+"%"}</span>
      </div>
    </div>
  );
}

    if(currentStep>=3)return;
    setUpdatingOrder(code);
    const nextStep=currentStep+1;

const LAB_SOUNDS={
  _ctx:null,

  select(){try{const a=this._getCtx();if(!a)return;const o=a.createOscillator();const g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(880,a.currentTime);o.frequency.exponentialRampToValueAtTime(1200,a.currentTime+0.08);g.gain.setValueAtTime(0.12,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.12);o.start();o.stop(a.currentTime+0.12);}catch(e){}},

  step(){try{const a=this._getCtx();if(!a)return;const o=a.createOscillator();const g=a.createGain();o.type="sine";o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(523,a.currentTime);o.frequency.exponentialRampToValueAtTime(784,a.currentTime+0.15);g.gain.setValueAtTime(0.08,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.2);o.start();o.stop(a.currentTime+0.2);}catch(e){}},
  protein(){try{const a=this._getCtx();if(!a)return;const o=a.createOscillator();const g=a.createGain();o.type="triangle";o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(160,a.currentTime);o.frequency.exponentialRampToValueAtTime(90,a.currentTime+0.18);g.gain.setValueAtTime(0.18,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.22);o.start();o.stop(a.currentTime+0.22);const o2=a.createOscillator();const g2=a.createGain();o2.connect(g2);g2.connect(a.destination);o2.frequency.setValueAtTime(440,a.currentTime+0.1);o2.frequency.exponentialRampToValueAtTime(620,a.currentTime+0.2);g2.gain.setValueAtTime(0.06,a.currentTime+0.1);g2.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.25);o2.start(a.currentTime+0.1);o2.stop(a.currentTime+0.25);}catch(e){}},
  salsa(){try{const a=this._getCtx();if(!a)return;const o=a.createOscillator();const g=a.createGain();o.type="sine";o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(700,a.currentTime);o.frequency.linearRampToValueAtTime(380,a.currentTime+0.1);o.frequency.linearRampToValueAtTime(560,a.currentTime+0.2);o.frequency.linearRampToValueAtTime(300,a.currentTime+0.3);g.gain.setValueAtTime(0.1,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.32);o.start();o.stop(a.currentTime+0.32);}catch(e){}},

function spawnParticles(x,y,color,count){
  count=count||10;
  const colors=color?[color]:["#ff2200","#ff6600","#ffaa00","#ffd700"];
  for(var i=0;i<count;i++){
    var el=document.createElement('div');
    el.className='card-ptcl';
    var angle=(i/count)*360+Math.random()*20;
    var dist=55+Math.random()*70;
    el.style.left=x+'px';el.style.top=y+'px';
    el.style.width=(5+Math.random()*7)+'px';el.style.height=(5+Math.random()*7)+'px';
    el.style.background=colors[i%colors.length];
    el.style.boxShadow='0 0 8px '+colors[i%colors.length];
    el.style.setProperty('--px',Math.cos(angle*Math.PI/180)*dist+'px');
    el.style.setProperty('--py',Math.sin(angle*Math.PI/180)*dist+'px');
    el.style.animationDelay=(i*.025)+'s';
    el.style.animationDuration=(.5+Math.random()*.25)+'s';
    document.body.appendChild(el);
    setTimeout(function(e){return function(){e.remove()}}(el),900);
  }
}

// ── ÍNDICE DE VOLATILIDAD (juego — no afecta el pedido) ──
function volatility(build){
  var v=18;
  if(build.size)v+=build.size.id==="experimento"?22:build.size.id==="formula"?14:7;
  v+=(build.proteins||[]).length*9;
  v+=(build.toppings||[]).length*4;
  if(build.salsa)v+=(build.salsa.heat||0)*11;
  if(build.cheese)v+=6;
  if(build.base&&build.base.id==="frito")v+=5;
  return Math.min(99,v);
}
function volLabel(v){
  if(v>=80)return{txt:"CRÍTICA",emoji:"🌋",col:"#ff3322"};
  if(v>=55)return{txt:"VOLÁTIL",emoji:"🔥",col:"#ff9900"};
  if(v>=35)return{txt:"ACTIVA",emoji:"⚡",col:"#ffd700"};
  return{txt:"ESTABLE",emoji:"🧊",col:"#3dbd52"};
}

function ExperimentLevelBar({build,proteinRules}){

  );
}

// ── PANTALLA DE BLOQUEO IN-APP BROWSER ──
function InAppBlocker({onSkip}){
  const ua=navigator.userAgent||"";
  const isTT=/TikTok|BytedanceWebview/i.test(ua);
  const isIG=/Instagram/i.test(ua);
  const isAndroid=/Android/i.test(ua);
  const[copied,setCopied]=useState(false);
  const copyLink=()=>{
    try{vibrate(10);}catch(e){}
    const link=window.location.href;
    const done=()=>setCopied(true);
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(link).then(done).catch(done);}
    else{try{const t=document.createElement("textarea");t.value=link;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();done();}catch(e){done();}}
  };
  const openExternal=()=>{
    try{vibrate(10);}catch(e){}
    const clean=window.location.href.replace(/^https?:\/\//,"");
    if(isAndroid){
      window.location.href="intent://"+clean+"#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+encodeURIComponent(window.location.href)+";end";
    }else{
      // iOS: intentar abrir Safari directo con x-safari-https
      window.location.href="x-safari-https://"+clean;
      // si seguimos visibles después de 1.2s, el truco falló → copiar link
      setTimeout(()=>{
        if(!document.hidden)copyLink();
      },1200);
    }
  };
  return(
    <div className="inapp-blocker">
      <div className="inapp-blocker-bg"/>
      <div className="inapp-logo-wrap">
        <div className="inapp-logo-emoji">🧪</div>
        <div className="inapp-logo-name">NACHO LAB</div>
      </div>
      <div className="inapp-blocker-title">Para pedir necesitas abrir en Safari</div>
      <div className="inapp-blocker-sub">
        Estás dentro de {isTT?"TikTok":isIG?"Instagram":"esta app"} — el navegador interno bloquea WhatsApp y el GPS.<br/>
        <strong>Solo toma 3 segundos:</strong>
      </div>
      <div className="inapp-step-box">
        <div className="inapp-step-row"><div className="inapp-step-num">1</div><div className="inapp-step-txt">Toca <span>···</span> arriba a la derecha</div></div>
        <div className="inapp-step-row"><div className="inapp-step-num">2</div><div className="inapp-step-txt">Selecciona <span>{isTT?'"Abrir en navegador"':'"Abrir en navegador externo"'}</span></div></div>
        <div className="inapp-step-row"><div className="inapp-step-num">3</div><div className="inapp-step-txt">¡Listo! Arma tu fórmula 🌮</div></div>
      </div>
      {!copied?(
        <button className="inapp-main-btn" onClick={openExternal}>
          {isAndroid?"🌐 Abrir en Chrome ahora":"🌐 Abrir en Safari ahora"}
        </button>
      ):(
        <div style={{width:"100%",padding:"16px",borderRadius:16,border:"2px solid var(--green)",background:"rgba(61,189,82,.08)",textAlign:"center"}}>
          <div style={{fontSize:28,marginBottom:6}}>✅</div>
          <div style={{fontSize:14,fontWeight:800,color:"var(--green)",marginBottom:4}}>Link copiado</div>
          <div style={{fontSize:12,color:"var(--tx2)",fontFamily:"var(--fm)",lineHeight:1.6}}>Ahora abre <strong style={{color:"var(--cream)"}}>Safari</strong> → pega en la barra de direcciones → Enter</div>
        </div>
      )}
      <div className="inapp-skip" onClick={onSkip}>
        Continuar de todas formas (algunas funciones no van a funcionar)
      </div>
    </div>
  );
}

function ZoneVerify({onEnter}){
  const[phase,setPhase]=useState("ask"); // ask | gps-loading | manual | result-ok | result-slow | result-no
  const[detectedZone,setDetectedZone]=useState(null);
  const[manualZone,setManualZone]=useState("");
  const[interest,setInterest]=useState({name:"",phone:"",area:""});
  const[sending,setSending]=useState(false);
  const[sent,setSent]=useState(false);

  const resolveZone=(zone)=>{
    setDetectedZone(zone);
    if(!zone){setPhase("result-no");return;}
    if(SLOW_ZONES.includes(zone)){setPhase("result-slow");}
    else{setPhase("result-ok");}
  };

  const tryGPS=()=>{
    if(!navigator.geolocation){setPhase("manual");return;}
    setPhase("gps-loading");
    navigator.geolocation.getCurrentPosition(
      async(pos)=>{
        try{
          const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&zoom=14&accept-language=es`);
          const j=await r.json();
          const addr=[j.address?.neighbourhood,j.address?.suburb,j.address?.quarter,j.address?.residential].filter(Boolean).join(" ");
          const zone=detectZoneFromAddress(addr);
          resolveZone(zone);
        }catch(e){setPhase("manual");}
      },
      ()=>setPhase("manual"),
      {enableHighAccuracy:true,timeout:10000}
    );
  };

  const submitInterest=async()=>{
    if(!interest.name.trim()||!interest.area.trim()){return;}
    setSending(true);
    try{
      await fetch("https://api.jsonbin.io/v3/b/6a1f8b2ada38895dfe7e9449",{
        method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":"$2a$10$yourmasterkey"},
        body:JSON.stringify({interest_zone:interest,ts:Date.now()})
      });
    }catch(e){}
    setSending(false);setSent(true);
  };

  return(
    <div className="zv-wrap">
      <div className="zv-bg"/>
      <div className="zv-logo">🧪</div>
      <div className="zv-brand">NACHO LAB</div>

      {phase==="ask"&&<>
        <div className="zv-title">¿Llegamos hasta ti?</div>
        <div className="zv-sub">Verificamos tu zona antes de que armes tu fórmula — así no pierdes tiempo si aún no llegamos.</div>
        <button className="zv-gps-btn" onClick={tryGPS}>📍 Verificar con mi ubicación GPS</button>
        <button className="zv-manual-btn" onClick={()=>setPhase("manual")}>Seleccionar zona manualmente</button>
        <div style={{fontSize:11,color:"var(--tx3)",fontFamily:"var(--fm)",textAlign:"center",lineHeight:1.6}}>
          Entregamos en: {DELIVERY_ZONES.join(" · ")}
        </div>
      </>}

      {phase==="gps-loading"&&<>
        <div className="zv-title">Detectando tu zona...</div>
        <div style={{fontSize:48,animation:"spin 1s linear infinite",marginTop:16}}>⏳</div>
      </>}

      {phase==="manual"&&<>
        <div className="zv-title">Selecciona tu zona</div>
        <div className="zv-sub">Elige el área más cercana a donde quieres recibir tu pedido.</div>
        <select className="zv-select" value={manualZone} onChange={e=>setManualZone(e.target.value)}>
          <option value="">Selecciona tu zona...</option>
          {DELIVERY_ZONES.map(z=><option key={z} value={z}>{z}</option>)}
          <option value="otra">Mi zona no está en la lista</option>
        </select>
        <button className="zv-ok" disabled={!manualZone} onClick={()=>{if(manualZone==="otra"){setPhase("result-no");}else{resolveZone(manualZone);}}}>
          Verificar →
        </button>
      </>}

      {phase==="result-ok"&&<>
        <div className="zv-result zv-result-ok">
          <div className="zv-result-icon">✅</div>
          <div className="zv-result-title" style={{color:"var(--green)"}}>¡Llegamos hasta ti!</div>
          <div className="zv-result-sub">Zona: <strong style={{color:"var(--cream)"}}>{detectedZone}</strong> · Delivery: <strong style={{color:ZONE_FEES[detectedZone]===0?"var(--green)":"var(--fire3)"}}>{ZONE_FEES[detectedZone]===0?"GRATIS 🎉":"$"+(ZONE_FEES[detectedZone]?ZONE_FEES[detectedZone].toFixed(2):"—")}</strong> {ZONE_FEES[detectedZone]!==0&&<span style={{color:"var(--green)",fontWeight:800}}>(GRATIS en $25+)</span>}<br/>Arma tu fórmula y te la llevamos en minutos.</div>
        </div>
        <button className="zv-ok" onClick={()=>onEnter(detectedZone)}>🌮 Armar mi fórmula →</button>
      </>}

      {phase==="result-slow"&&<>
        <div className="zv-result zv-result-slow">
          <div className="zv-result-icon">⚠️</div>
          <div className="zv-result-title" style={{color:"var(--fire3)"}}>Llegamos, pero puede tardar</div>

        <button className="zv-manual-btn" style={{marginTop:10}} onClick={()=>setPhase("ask")}>← Volver</button>

      {phase==="result-no"&&<>

            <div className="zv-ig"><label>👤 Tu nombre</label><input placeholder="Juan Pérez" value={interest.name} onChange={e=>setInterest(p=>({...p,name:e.target.value}))}/></div>
            <div className="zv-ig"><label>📞 WhatsApp</label><input type="tel" placeholder="6XXX-XXXX" value={interest.phone} onChange={e=>setInterest(p=>({...p,phone:e.target.value}))}/></div>
            <div className="zv-ig"><label>📍 ¿Dónde vives?</label><input placeholder="Ej: Altos de Panamá, Arraiján..." value={interest.area} onChange={e=>setInterest(p=>({...p,area:e.target.value}))}/></div>
            <button className="zv-ok" disabled={!interest.name.trim()||!interest.area.trim()||sending} onClick={submitInterest}>
              {sending?"Enviando...":"📩 Notifícame cuando lleguen"}
            </button>
          </div>
        ):(
          <div style={{textAlign:"center",padding:"20px 0"}}>
            <div style={{fontSize:36,marginBottom:8}}>🙏</div>
            <div style={{fontSize:15,fontWeight:800,color:"var(--green)",marginBottom:6}}>¡Anotado!</div>
            <div style={{fontSize:12,color:"var(--tx2)",fontFamily:"var(--fm)",lineHeight:1.6}}>Te avisamos en cuanto lleguemos a tu zona. Mientras tanto, comparte Nacho Lab con tus amigos.</div>
          </div>
        )}
      </>}
    </div>
  );
}
