              <div style={{margin:"8px 20px 0",padding:"10px 14px",background:"rgba(61,189,82,.06)",border:"1px solid rgba(61,189,82,.15)",borderRadius:12,fontSize:12,color:"var(--tx2)",fontWeight:600,lineHeight:1.5,fontFamily:"var(--fm)"}}>
                🌿 <strong style={{color:"var(--cream)"}}>Libres ilimitados</strong> · ⭐ <strong style={{color:"var(--fire3)"}}>Premium +$0.99 c/u</strong>
                {selPrem.length>0&&<span style={{color:"var(--fire1)"}}> · +${(selPrem.length*0.99).toFixed(2)}</span>}
              </div>
              <div style={{padding:"10px 20px 4px",fontSize:10,fontWeight:800,color:"var(--tx3)",letterSpacing:"2px",textTransform:"uppercase",fontFamily:"var(--fm)"}}>🌿 LIBRES</div>
              <div className="tw">{freeTop.map(t=>(
                <button key={t.id} className={"tcwow"+(build.toppings.find(x=>x.id===t.id)?" wton":"")}
                  onClick={(e)=>{const rect=e.currentTarget.getBoundingClientRect();spawnParticles(rect.left+rect.width/2,rect.top+rect.height/2,"#44cc22",8);if(!build.toppings.find(x=>x.id===t.id))flyToBeaker(rect.left+rect.width/2,rect.top+rect.height/2,t.emoji,"#44cc22");togT(t);}}>
                  <span className="tce">{t.emoji}</span>{t.name}
                </button>
              ))}</div>
              <div style={{padding:"10px 20px 4px",fontSize:10,fontWeight:800,color:"var(--fire3)",letterSpacing:"2px",textTransform:"uppercase",fontFamily:"var(--fm)"}}>⭐ PREMIUM +$0.99 C/U</div>
              <div className="tw">{premTop.map(t=>{
                const sel=!!build.toppings.find(x=>x.id===t.id);
                const selIdx=build.toppings.filter(x=>x.premium).findIndex(x=>x.id===t.id);
                const isFree=sel&&selIdx<premIncl;
                return(
                  <button key={t.id} className={"tcwow"+(sel?" wton":"")}
                    onClick={(e)=>{const rect=e.currentTarget.getBoundingClientRect();spawnParticles(rect.left+rect.width/2,rect.top+rect.height/2,sel?"#ff2200":"#44cc22",8);if(!sel)flyToBeaker(rect.left+rect.width/2,rect.top+rect.height/2,t.emoji,"#44cc22");togT(t);}}>
                    <span className="tce">{t.emoji}</span>{t.name}
                    {sel&&isFree&&<span style={{fontSize:9,fontFamily:"var(--fm)",color:"var(--fire3)",fontWeight:800}}>INCL.</span>}
                    {sel&&!isFree&&<span style={{fontSize:9,fontFamily:"var(--fm)",color:"var(--fire1)",fontWeight:800}}>+$0.99</span>}
                  </button>
                );
              })}</div>
            </>);
          })()}
          <StickyCTA onBack={goBack} label="Continuar con la salsa →" onClick={()=>setStep(5)}/>
        </div>}

        {step===5&&<div className="step-wow step-pb">
          <StepHdrWow num={5} total={8} title="CATALIZADOR LÍQUIDO" color="var(--fire1)" sub="🧪 1 gratis · adicional +$0.99" icon="🌶️"/>
          <div className="lgrid">{aSl.map(s=>{
            const sel=build.salsa?.id===s.id;
            return <LRow key={s.id} emoji={s.emoji} name={s.name} sub={s.desc||""} heat={s.heat||0} selected={sel} selMod="r" onSelect={(e)=>{const r=e.currentTarget.getBoundingClientRect();const sc=SALSA_COLORS[s.id];spawnParticles(r.left+r.width/2,r.top+r.height/2,sc?sc.top:"#cc0033",10);pick("salsa",s,6);}}/>;
          })}</div>
          <StickyCTA onBack={goBack} label={build.salsa?"Continuar con las bebidas →":"Continuar sin salsa →"} onClick={()=>{if(!build.salsa)setBuild(b=>({...b,salsa:null}));setStep(6);}} skip={build.salsa?"Continuar sin salsa":null} onSkip={()=>{setBuild(b=>({...b,salsa:null}));setStep(6);}}/>
        </div>}

        {step===6&&<div className="step-wow step-pb">
          <StepHdrWow num={6} total={8} title="BEBIDAS" color="var(--fire3)" sub="🥤 Completa la experiencia" icon="🥤"/>
          <div className="dkgrid">{drinks.filter(d=>d.active!==false).map(d=>{
            const qty=cartDrinks.filter(x=>x.id===d.id).length;
            return(
              <div key={d.id} className={"dkcard"+(qty>0?" sel":"")}
                onClick={(e)=>{const rect=e.currentTarget.getBoundingClientRect();spawnParticles(rect.left+rect.width/2,rect.top+rect.height/2,"#00e5ff",10);addDrink(d);}}>
                {qty>0&&<div className="i-chk" style={{background:"linear-gradient(135deg,#00acc1,#00bcd4)"}}>✓</div>}
                <div className="i-emoji">{d.emoji}</div>
                <div className="i-name">{d.name}</div>
                <div className="i-desc">{d.desc}</div>
                <div className="dk-price">${Number(d.price).toFixed(2)}</div>
                {qty>0&&<div className="dk-qty">
                  <button onClick={(e)=>{e.stopPropagation();removeDrink(d);}}>−</button>
                  <span>{qty}</span>
                  <button onClick={(e)=>{e.stopPropagation();addDrink(d);}}>+</button>
                </div>}
              </div>
            );
          })}</div>
          <StickyCTA onBack={goBack} label="🔬 Ver mi fórmula →" onClick={goToSummary} skip="Continuar sin bebida" onSkip={goToSummary}/>
        </div>}

        {step===7&&<div className="step-wow step-pb">
          <StepHdrWow num={7} total={9} title="FÓRMULA LISTA" color="var(--green)" sub="🔬 Lista para iniciar la reacción" icon="✅"/>
          <div className="fr-wow">
            <div className="fr-hdr">
              <div className="fr-title">🧬 TU FÓRMULA</div>
              <div className="fr-tot">${(pc(build.size,build.proteins,proteinRules,build.toppings,build.cheese)+drinkTotal).toFixed(2)}</div>
            </div>
            {[["TAMAÑO",build.size?.name],["BASE",build.base?.name],["PROTEÍNAS",build.proteins.length?build.proteins.map(p=>p.name).join(", "):"—"],["QUESO",build.cheese?.name||"—"],["TOPPINGS",build.toppings.length?build.toppings.map(t=>t.name).join(", "):"Sin extras"],["SALSA",build.salsa?.name||"—"],cartDrinks.length>0&&["BEBIDAS",cartDrinks.map(d=>d.name).join(", ")]].filter(Boolean).map(([l,v])=>(
              <div key={l} className="fr-row"><span className="fr-lbl">{l}</span><span className="fr-val">{v}</span></div>
            ))}
          </div>
          <StickyCTA onBack={goBack} label="🏷️ Bautizar mi fórmula →" onClick={()=>setStep(8)}/>
        </div>}

        {step===8&&<div className="step-wow step-pb">
          <StepHdrWow num={8} total={9} title="BAUTIZA TU FÓRMULA" color="var(--fire3)" sub="🧬 Dale un nombre que la historia recuerde" icon="⚗️"/>
          <div style={{padding:"20px 20px 0"}}>
            <div style={{background:"var(--bg2)",border:"2px solid var(--bd2)",borderRadius:18,padding:"24px",marginBottom:16,textAlign:"center"}}>
              <div style={{fontSize:52,marginBottom:12}}>⚗️</div>
              <div style={{fontFamily:"var(--fd)",fontSize:14,color:"var(--tx3)",letterSpacing:"3px",textTransform:"uppercase",marginBottom:16}}>Nombre de tu fórmula</div>
              <input
                value={build.formulaName||""}
                onChange={e=>setBuild(b=>({...b,formulaName:e.target.value}))}
                placeholder="Ej: El Destructor, La Bestia, Mi Fórmula..."
                maxLength={32}
                style={{
                  width:"100%",background:"transparent",border:"none",borderBottom:"2px solid var(--fire3)",
                  textAlign:"center",fontFamily:"var(--fd)",fontSize:"clamp(22px,7vw,32px)",
                  color:"var(--cream)",padding:"8px 0",letterSpacing:"2px",outline:"none",
                  caretColor:"var(--fire3)"
                }}
              />
              <div style={{fontSize:11,color:"var(--tx3)",marginTop:8,fontFamily:"var(--fm)"}}>{(build.formulaName||"").length}/32 caracteres</div>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:20}}>
              {["El Destructor","La Bestia","Mi Clásica","El Inferno","La Reina","El Científico","El Mundial","La Fórmula X"].map(sug=>(
                <button key={sug}
                  onClick={()=>setBuild(b=>({...b,formulaName:sug}))}
                  style={{padding:"7px 14px",borderRadius:50,border:"1.5px solid var(--bd2)",background:build.formulaName===sug?"rgba(255,153,0,.12)":"var(--bg2)",color:build.formulaName===sug?"var(--fire3)":"var(--tx2)",fontSize:12,fontWeight:700,cursor:"pointer",transition:"all .2s",fontFamily:"var(--fb)"}}>
                  {sug}
                </button>
              ))}
            </div>
          </div>
          <div className="ig" style={{marginTop:12}}>
            <label>📝 Notas especiales (opcional)</label>
            <textarea placeholder="Ej: sin cilantro, extra picante, alergia a algo..." 
              value={build.notes||""} 
              onChange={e=>setBuild(b=>({...b,notes:e.target.value}))}
              style={{minHeight:60,fontSize:16,borderRadius:14,padding:12,background:"var(--bg2)",border:"1px solid var(--bd)",color:"var(--cream)",fontFamily:"var(--fm)",resize:"none"}}/>
          </div>
          <StickyCTA onBack={goBack} label={build.formulaName?`🧪 Completar "${build.formulaName}"`:"🧪 Completar Fórmula"} onClick={()=>{
            try{LAB_SOUNDS.complete();}catch(e){}
            vibrate([50,30,50,30,100]);
            const snap={...build,price:pc(build.size,build.proteins,proteinRules,build.toppings,build.cheese),code:genSpecCode(),vol:volatility(build)};
            snap.vl_col=volLabel(snap.vol).col;
            setShowFormulaComplete(true);
            setTimeout(()=>{addCart();setShowFormulaComplete(false);setLabelData(snap);},1800);
          }}/>
        </div>}

        </>
      )}
    </div>}

    {/* CART TAB */}
    {tab==="cart"&&<div className="scr pt">
      <div className="sh"><div className="st">Tu <span className="gw">CARRITO</span></div><div className="ss">{cart.length} orden{cart.length!==1?"es":""} en laboratorio</div></div>
      {cart.length===0
        ?<div className="cempty"><div className="ei">🧪</div><h3>Carrito vacío</h3><p>"Crea tu primera fórmula 🌮"</p>{canOrder&&<button className="btn3d b-fire3d" onClick={()=>setTab("order")}>🌶️ Crear mi fórmula</button>}</div>
        :<>
          <div style={{margin:"0 20px 12px",padding:"12px 16px",background:freeDelivery&&cust.zone?"rgba(61,189,82,.08)":"rgba(255,153,0,.07)",border:freeDelivery&&cust.zone?"1.5px solid rgba(61,189,82,.35)":"1.5px solid rgba(255,153,0,.3)",borderRadius:14,display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:22}}>🛵</span>
            <div style={{flex:1,fontSize:12,fontFamily:"var(--fm)",lineHeight:1.5}}>
              {freeDelivery&&cust.zone
                ?<span style={{color:"var(--green)",fontWeight:800}}>¡Tu delivery sale GRATIS! (pedido $25+)</span>
                :cust.zone&&ZONE_FEES[cust.zone]===0
                ?<span style={{color:"var(--green)",fontWeight:800}}>Delivery a {cust.zone}: ¡GRATIS! 🎉</span>
                :cust.zone&&ZONE_FEES[cust.zone]
                ?<span style={{color:"var(--cream)",fontWeight:700}}>Delivery a <strong style={{color:"var(--fire3)"}}>{cust.zone}</strong>: <strong style={{color:"var(--fire3)"}}>${ZONE_FEES[cust.zone].toFixed(2)}</strong>{foodAfterDisc>=18&&foodAfterDisc<FREE_DELIVERY_MIN&&<span style={{color:"var(--green)",fontWeight:800}}> · ¡a ${(FREE_DELIVERY_MIN-foodAfterDisc).toFixed(2)} del gratis!</span>}</span>
                :<span style={{color:"var(--tx2)",fontWeight:700}}>Delivery <strong style={{color:"var(--fire3)"}}>desde $0.99</strong> según tu zona · <strong style={{color:"var(--green)"}}>GRATIS en $25+</strong></span>}
            </div>
          </div>
          {cart.map((item,idx)=>(
            <div key={item.id} className="ci">
              <div className="cib"><h4>🧪 {item.formulaName?`"${item.formulaName}"`:item.size.name+` #${idx+1}`}</h4><p>{item.base.name} · {(item.proteins||[item.protein]).filter(Boolean).map(p=>p.name).join(", ")}{item.toppings.length>0&&" · "+item.toppings.map(t=>t.name).join(", ")} · {item.salsa.name}</p></div>
              <div className="cir"><span className="cip">${item.price.toFixed(2)}</span><button className="btn3d b-fire3d" style={{padding:"7px 11px",fontSize:12,animation:"none"}} onClick={()=>rmCart(item.id)}>✕</button></div>
            </div>
          ))}
          {cartDrinks.length>0&&<div style={{margin:"8px 20px 0",background:"var(--bg2)",border:"1px solid rgba(0,188,212,.18)",borderRadius:14,padding:"14px 16px"}}>
            <div style={{fontSize:10,fontWeight:800,color:"#00bcd4",letterSpacing:"2px",marginBottom:8,fontFamily:"var(--fm)"}}>🥤 BEBIDAS</div>
            {Object.entries(cartDrinks.reduce((acc,d)=>{acc[d.id]={...d,qty:(acc[d.id]?.qty||0)+1};return acc;},{})).map(([id,d])=>(
              <div key={id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid rgba(0,188,212,.07)"}}>
                <span style={{fontSize:13,fontWeight:600,color:"var(--cream)"}}>{d.emoji} {d.name} ×{d.qty}</span>
                <span style={{fontSize:13,fontWeight:700,color:"#00e5ff",fontFamily:"var(--fd)"}}>${(d.price*d.qty).toFixed(2)}</span>
              </div>
            ))}
          </div>}

          {/* DISCOUNT FIELD */}
          <div className="disc-field">
            <div className={discApplied?"disc-applied":"disc-field-lbl"}>🎟️ {discApplied?`${appliedDiscount}% DESCUENTO APLICADO ✅`:"CÓDIGO DE DESCUENTO"}</div>
            {!discApplied?(
              <div className="disc-input-row">
                <input className="disc-input" placeholder={registeredCode||"NL-XXXX"} value={discCode} onChange={e=>setDiscCode(e.target.value.toUpperCase())} onFocus={()=>{if(registeredCode&&!discCode)setDiscCode(registeredCode);}}/>
                <button className="btn3d b-amber3d" style={{padding:"10px 14px",fontSize:13,animation:"none"}} onClick={applyDiscCode}>Aplicar</button>
              </div>
            ):(
              <div className="disc-applied-box">
                <div><div className="disc-code-show">{discCode}</div><div className="disc-save">−${discAmt.toFixed(2)} de descuento</div></div>
                <button className="btn3d b-fire3d" style={{padding:"7px 12px",fontSize:12,animation:"none"}} onClick={()=>{setDiscApplied(false);setDiscCode("");}}>Quitar</button>
              </div>
            )}
          </div>

          <div className="ctot">
            <div style={{flex:1}}>
              <div style={{fontSize:12,color:"var(--tx2)",fontFamily:"var(--fm)",fontWeight:600,marginBottom:2}}>Subtotal: ${rawTotal.toFixed(2)}</div>
              {discApplied&&<div style={{fontSize:12,color:"var(--green)",fontFamily:"var(--fm)",fontWeight:700,marginBottom:2}}>Descuento {appliedDiscount}%: −${discAmt.toFixed(2)}</div>}
              {freeDelivery&&cust.zone
                ?<div style={{fontSize:12,color:"var(--green)",fontFamily:"var(--fm)",fontWeight:800,marginBottom:4}}>🛵 Delivery: ¡GRATIS! (pedido $25+)</div>
                :cust.zone&&ZONE_FEES[cust.zone]===0
                ?<div style={{fontSize:12,color:"var(--green)",fontFamily:"var(--fm)",fontWeight:800,marginBottom:4}}>🛵 Delivery {cust.zone}: GRATIS 🎉</div>
                :deliveryFee>0
                ?<div style={{fontSize:12,color:"var(--fire3)",fontFamily:"var(--fm)",fontWeight:700,marginBottom:4}}>🛵 Delivery {cust.zone}: +${deliveryFee.toFixed(2)}{foodAfterDisc>=18&&<span style={{color:"var(--green)",fontWeight:800}}> · ¡A ${(FREE_DELIVERY_MIN-foodAfterDisc).toFixed(2)} del envío gratis!</span>}</div>
                :<div style={{fontSize:11,color:"var(--tx3)",fontFamily:"var(--fm)",fontWeight:600,marginBottom:4}}>🛵 Delivery según zona · GRATIS en pedidos $25+</div>}
              <div className="ctl">TOTAL A PAGAR</div>
              <div className="ctotal">${total.toFixed(2)}</div>
            </div>
            <button className="btn3d b-outline3d" style={{animation:"none"}} onClick={()=>setTab("order")}>+ Añadir</button>
          </div>

          {!registeredCode?(
            /* ── GATE: REGISTRO OBLIGATORIO PARA PEDIR ── */
            <div style={{margin:"24px 20px 160px",padding:"28px 20px",background:"linear-gradient(135deg,rgba(255,153,0,.08),rgba(255,26,0,.05))",border:"2px solid rgba(255,153,0,.35)",borderRadius:20,textAlign:"center"}}>
              <div style={{fontSize:48,marginBottom:12}}>🧪</div>
              <div style={{fontFamily:"var(--fd)",fontSize:24,fontWeight:900,color:"var(--cream)",letterSpacing:1,marginBottom:8}}>REGÍSTRATE PARA PEDIR</div>
              <div style={{fontSize:13,color:"var(--tx2)",lineHeight:1.6,marginBottom:6,fontWeight:500}}>Para enviar tu pedido necesitas una cuenta de científico.</div>
              <div style={{fontSize:13,color:"var(--fire3)",fontWeight:800,marginBottom:18,fontFamily:"var(--fm)"}}>🎟️ Bono: 30% OFF en tu primera orden</div>
              <button className="btn3d b-fire3d bfull" style={{padding:"15px",fontSize:15}} onClick={()=>setShowZoneCheck(true)}>⚗️ Registrarme gratis — 30 segundos</button>
              <div style={{fontSize:11,color:"var(--tx3)",marginTop:12,fontFamily:"var(--fm)",lineHeight:1.5}}>🛵 Solo entregamos en:<br/>{DELIVERY_ZONES.join(" · ")}</div>
            </div>
          ):(
            <>
            {/* DATOS DE ENTREGA */}
            <div className="sh" style={{paddingTop:24}}><div className="st" style={{fontSize:26}}>Datos de <span className="gw">ENTREGA</span></div><div className="ss">🛵 Solo entregamos en: {DELIVERY_ZONES.join(" · ")}</div></div>
            <div style={{padding:"14px 20px 0"}}>
              <div className="ig"><label>👤 Tu nombre *</label><input placeholder="Ej: Juan Pérez" value={cust.name||""} onChange={e=>setCustF("name",e.target.value)}/></div>
              <div className="ig"><label>📞 Teléfono (WhatsApp) *</label><input type="tel" placeholder="6XXX-XXXX" value={cust.phone||""} onChange={e=>setCustF("phone",e.target.value)}/></div>
              <div className="ig"><label>📍 Zona de entrega *</label>
                <select value={cust.zone||""} onChange={e=>setCustF("zone",e.target.value)}>
                  <option value="">Selecciona tu zona...</option>
                  {DELIVERY_ZONES.map(z=><option key={z} value={z}>{z} — {ZONE_FEES[z]===0?"Delivery GRATIS 🎉":"Delivery $"+ZONE_FEES[z].toFixed(2)}</option>)}
                </select>
              </div>
              {/* GPS */}
              {gpsStatus!=="ok"?(
                <button onClick={captureGPS} disabled={gpsStatus==="loading"} style={{width:"100%",padding:"13px",marginBottom:14,borderRadius:12,border:"1.5px dashed rgba(255,153,0,.4)",background:"rgba(255,153,0,.05)",color:"var(--fire3)",fontSize:14,fontWeight:800,cursor:"pointer",fontFamily:"var(--fb)",display:"flex",alignItems:"center",justifyContent:"center",gap:8,WebkitTapHighlightColor:"transparent"}}>
                  {gpsStatus==="loading"?"⏳ Obteniendo ubicación...":"📍 Usar mi ubicación GPS (recomendado)"}
                </button>
              ):(
                <div style={{marginBottom:14,padding:"12px 14px",borderRadius:12,border:"1.5px solid rgba(61,189,82,.35)",background:"rgba(61,189,82,.06)",display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:20,flexShrink:0}}>📍</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:800,color:"var(--green)"}}>Ubicación GPS capturada ✓</div>
                    {cust.gpsAddr&&<div style={{fontSize:11,color:"var(--tx2)",marginTop:2,fontFamily:"var(--fm)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{cust.gpsAddr}</div>}
                  </div>
                  <button onClick={clearGPS} style={{background:"none",border:"1px solid rgba(255,255,255,.15)",borderRadius:8,color:"var(--tx3)",fontSize:11,padding:"5px 9px",cursor:"pointer",flexShrink:0,fontFamily:"var(--fm)"}}>Cambiar</button>
                </div>
              )}
              <div className="ig"><label>🏠 Dirección / Edificio / Referencia *</label><textarea placeholder="Ej: PH Torre Mar, apto 10B, frente al parque..." value={cust.addr||""} onChange={e=>setCustF("addr",e.target.value)} style={{minHeight:60}}/></div>
            </div>

            <div className="sh" style={{paddingTop:24}}><div className="st" style={{fontSize:26}}>Método de <span className="gw">PAGO</span></div></div>
            <div className="pgrid">{aPay.map(pm=>(
              <div key={pm.id} className={`pcard${pay===pm.id?" sel":""}`} onClick={()=>setPay(pm.id)}>
                <div className="pi">{pm.icon}</div><div className="pn">{pm.name}</div><div className="pd">{pm.desc}</div>
              </div>
            ))}</div>

            <div style={{padding:"18px 20px 160px"}}>
              <button className="btn3d b-wa3d bfull" style={{padding:"16px",fontSize:16,opacity:(!pay||!cust.name||!cust.zone||!cust.addr)?.6:1}} onClick={sendOrder}>
                📲 Enviar pedido por WhatsApp
              </button>
              {(!cust.name||!cust.zone||!cust.addr||!pay)&&<div style={{textAlign:"center",fontSize:11,color:"var(--fire3)",fontFamily:"var(--fm)",marginTop:8,fontWeight:700}}>
                ⚠️ Falta: {[!cust.name&&"tu nombre",!cust.zone&&"zona",!cust.addr&&"dirección",!pay&&"método de pago"].filter(Boolean).join(" · ")}
              </div>}
              <p className="note">Pedidos por WhatsApp · Confirmamos en minutos{discApplied?` · ${appliedDiscount}% desc. aplicado 🎟️`:""}</p>
            </div>
            </>
          )}
        </>
      }
    </div>}

    {/* TRACK TAB */}
    {tab==="track"&&<div className="scr pt">
      <div className="sh"><div className="st">Rastrear <span className="gw">FÓRMULA</span></div><div className="ss">🔬 Sigue tu pedido en tiempo real</div></div>
      <div style={{padding:"16px 20px 0"}}>
        <div className="ig"><label>Código de pedido</label><input placeholder="Ej: NLO-1234" value={tid} onChange={e=>setTid(e.target.value.toUpperCase())} onKeyDown={e=>e.key==="Enter"&&doTrack()}/></div>
        <button className="btn3d b-fire3d" onClick={doTrack} disabled={trackLoading} style={{width:"100%",marginTop:10}}>
          {trackLoading?"🔄 Buscando...":"🔍 Rastrear pedido"}
        </button>
      </div>

      {tracked&&<div style={{padding:"24px 20px 0",animation:"fadeUp .4s ease"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div>
            <div style={{fontSize:10,color:"var(--tx3)",fontWeight:700,textTransform:"uppercase",letterSpacing:2,fontFamily:"var(--fm)"}}>Fórmula</div>
            <div style={{fontFamily:"var(--fd)",fontSize:32,fontWeight:900,background:"linear-gradient(135deg,var(--fire1),var(--fire3))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",letterSpacing:2}}>{tracked.id}</div>
          </div>
          <span style={{background:tracked.si===3?"rgba(61,189,82,.12)":"rgba(255,153,0,.08)",border:tracked.si===3?"1px solid rgba(61,189,82,.3)":"1px solid rgba(255,153,0,.25)",color:tracked.si===3?"var(--green)":"var(--fire3)",padding:"5px 12px",borderRadius:8,fontSize:11,fontWeight:700,fontFamily:"var(--fm)"}}>
            {tracked.si===3?"✅ ENTREGADO":"⏳ "+tracked.statusLabel}
          </span>
        </div>

        {tracked.total&&<div style={{background:"var(--bg2)",border:"1px solid var(--bd)",borderRadius:12,padding:"12px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:12,color:"var(--tx2)",fontWeight:600,fontFamily:"var(--fm)"}}>💰 Total · {tracked.payment}</div>
          <div style={{fontFamily:"var(--fd)",fontSize:22,color:"var(--fire3)",fontWeight:900}}>${Number(tracked.total).toFixed(2)}</div>
        </div>}

        <div className="tks">{tracked.steps.map((s,i)=>(
          <div key={i} className="tk">
            <div className="tl">
              <div className={`td${s.done?" dn":i===tracked.si?" ac":""}`}>{s.done?"✓":i===tracked.si?"🔥":"·"}</div>
              {i<tracked.steps.length-1&&<div className={`tc2${s.done?" dn":""}`}/>}
            </div>
            <div className="ti">
              <h4 style={{color:s.done?"var(--green)":i===tracked.si?"var(--fire3)":"var(--tx3)"}}>{s.label}</h4>
              <p>{s.desc}</p>
              <div className="tt">{s.time!=="--"?s.time:""}</div>
            </div>
          </div>
        ))}</div>

        <div style={{display:"flex",gap:10,padding:"16px 0 0"}}>
          <button className="btn3d b-wa3d" style={{flex:1}} onClick={()=>makeWA(settings.wa,`Hola, consulto sobre mi pedido ${tracked.id}`)}>💬 WhatsApp</button>
          <button className="btn3d b-outline3d" style={{flex:1,animation:"none"}} onClick={()=>{setTracked(null);setTid("");}}>🔍 Otro pedido</button>
        </div>
      </div>}

      {/* HISTORIAL DE PEDIDOS */}
      {(()=>{const hist=JSON.parse(localStorage.getItem("nl_order_history")||"[]");return hist.length>0&&(
        <div style={{padding:"24px 20px 0"}}>
          <div style={{fontSize:12,fontWeight:800,color:"var(--tx3)",textTransform:"uppercase",letterSpacing:2,fontFamily:"var(--fm)",marginBottom:12}}>🧾 Mis pedidos anteriores</div>
          {hist.map((h,i)=>(
            <div key={i} style={{background:"var(--bg2)",border:"1px solid var(--bd)",borderRadius:12,padding:"12px 16px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}
              onClick={()=>{setTid(h.code);doTrack&&setTimeout(()=>{const el=document.querySelector("input[placeholder]");if(el){el.value=h.code;setTid(h.code);}},100);}}>
              <div>
                <div style={{fontFamily:"var(--fd)",fontSize:16,color:"var(--fire3)",letterSpacing:1}}>{h.code}</div>
                <div style={{fontSize:11,color:"var(--tx3)",marginTop:2,fontFamily:"var(--fm)"}}>{h.items?.map(it=>it.size).join(", ")} · {h.time}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontFamily:"var(--fd)",fontSize:18,color:"var(--cream)"}}>${Number(h.total||0).toFixed(2)}</div>
                <div style={{fontSize:10,color:"var(--fire3)",fontWeight:700,fontFamily:"var(--fm)"}}>Ver estado →</div>
              </div>
            </div>
          ))}
        </div>
      );})()}
    </div>}

    {/* EVENTS TAB */}
    {tab==="events"&&<div className="scr pt">
      <div className="sh"><div className="st">Reservar <span className="fi">EVENTO</span></div><div className="ss">🎪 Llevamos el lab a donde estés · desde 10 personas</div></div>
      {evDone
        ?<div className="succ"><div className="si">🎉</div><h2>¡RESERVA ENVIADA!</h2><p>Te contactaremos por WhatsApp en las próximas horas.</p><button className="btn3d b-outline3d" style={{animation:"none"}} onClick={()=>{setEvDone(false);setEvT(null);setEvF({name:"",phone:"",date:"",time:"",address:"",guests:"",notes:""});}}>Nueva reserva</button></div>
        :<>
          <div className="egrid">{aEv.map(ev=><div key={ev.id} className={`ev${evT?.id===ev.id?" sel":""}`} onClick={()=>setEvT(ev)}><div className="evi">{ev.icon}</div><div className="evn">{ev.name}</div><div className="evm">Mín. {ev.min} personas</div><div className="evp">${ev.ppp}/persona</div></div>)}</div>
          {evT&&<div style={{padding:"20px 20px 0",animation:"fadeUp .35s ease"}}>
            <div className="st" style={{fontSize:24,marginBottom:14}}>Detalles del <span className="gw">evento</span></div>
            <div className="ir"><div className="ig"><label>Nombre / Empresa *</label><input value={evF.name} onChange={e=>setEvF(f=>({...f,name:e.target.value}))}/></div><div className="ig"><label>Teléfono *</label><input type="tel" value={evF.phone} onChange={e=>setEvF(f=>({...f,phone:e.target.value}))}/></div></div>
            <div className="ir"><div className="ig"><label>Fecha *</label><input type="date" value={evF.date} onChange={e=>setEvF(f=>({...f,date:e.target.value}))}/></div><div className="ig"><label>Hora *</label><input type="time" value={evF.time} onChange={e=>setEvF(f=>({...f,time:e.target.value}))}/></div></div>
            <div className="ir"><div className="ig"><label>Personas *</label><input type="number" value={evF.guests} onChange={e=>setEvF(f=>({...f,guests:e.target.value}))}/></div><div className="ig"><label>Dirección *</label><input value={evF.address} onChange={e=>setEvF(f=>({...f,address:e.target.value}))}/></div></div>
            <div className="ig"><label>Notas</label><textarea value={evF.notes} onChange={e=>setEvF(f=>({...f,notes:e.target.value}))}/></div>
            {evF.guests&&<div className="sumbox" style={{margin:"0 0 16px"}}><div className="sumhdr"><span>💰 ESTIMADO</span></div><div className="sumrow"><span className="slb">Tipo</span><span className="svl">{evT.name}</span></div><div className="sumrow"><span className="slb">Personas</span><span className="svl">{evF.guests}</span></div><div className="stot"><span className="slb">Total estimado</span><span className="svl">${(Number(evF.guests)*evT.ppp).toFixed(2)}</span></div></div>}
            <button className="btn3d b-wa3d bfull" style={{padding:"16px",fontSize:16}} onClick={sendEv}>📲 Enviar reserva por WhatsApp</button>
          </div>}
        </>
      }
    </div>}

    {/* BANNER ENTREGA — solo visible en dispositivo admin */}
    {isAdminDevice&&deliveryOrders.map(order=>(
      <div key={order.code} style={{position:"fixed",bottom:"calc(72px + var(--sb))",left:"50%",transform:"translateX(-50%)",width:"calc(100% - 24px)",maxWidth:406,zIndex:190,animation:"fadeUp .4s ease"}}>
        <div style={{background:"linear-gradient(135deg,#1a3d1a,#0d2b0d)",border:"2px solid #3dbd52",borderRadius:18,padding:"14px 16px",boxShadow:"0 8px 32px rgba(0,0,0,.6)"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <span style={{fontSize:22}}>🛵</span>
            <div style={{flex:1}}>
              <div style={{fontSize:12,fontWeight:800,color:"#3dbd52",fontFamily:"var(--fm)",letterSpacing:"1px"}}>PEDIDO EN CAMINO</div>
              <div style={{fontSize:13,fontWeight:700,color:"var(--cream)"}}>#{order.code} · ${(order.finalTotal||0).toFixed(2)}</div>
            </div>
          </div>
          <button
            onClick={()=>markDelivered(order)}
            disabled={markingDelivered===order.code}
            style={{width:"100%",padding:"14px",borderRadius:12,border:"none",background:markingDelivered===order.code?"rgba(61,189,82,.3)":"linear-gradient(135deg,#3dbd52,#28962f)",color:"#fff",fontWeight:900,fontSize:15,cursor:"pointer",fontFamily:"var(--fb)",letterSpacing:".5px"}}>
            {markingDelivered===order.code?"⏳ Marcando...":"✅ Ya entregué — marcar como entregado"}
          </button>
        </div>
      </div>
    ))}

    {/* BOTTOM NAV */}
    <nav className="bnav">
      {[["order","🌮","ORDENAR"],["cart","🛒","CARRITO"],["track","📍","RASTREAR"],["events","🎪","EVENTOS"]].map(([id,ic,lb])=>(
        <button key={id} className={`nb${tab===id?" on":""}`} onClick={()=>setTab(id)}>
          <span className="bi">{ic}</span><span>{lb}</span>
          {id==="cart"&&cart.length>0&&<span className="nbadge">{cart.length}</span>}
        </button>
      ))}
    </nav>

    {showExplosion&&<Explosion onDone={()=>{setShowExplosion(false);setExploded(true);}}/>}
    {labelData&&<SpecimenLabel data={labelData} onClose={()=>setLabelData(null)}/>}
    {showZoneCheck&&(
      <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&setShowZoneCheck(false)}>
        <div className="modal" style={{borderRadius:"22px 22px 0 0"}}>
          <div className="modal-handle"/>
          <div style={{padding:"24px 24px 0",textAlign:"center"}}>
            <div style={{fontSize:48,marginBottom:12}}>📍</div>
            <div style={{fontFamily:"var(--fd)",fontSize:26,fontWeight:900,color:"var(--cream)",marginBottom:8,letterSpacing:1}}>¿Estás en nuestra zona?</div>
            <p style={{fontSize:13,color:"var(--tx2)",lineHeight:1.7,fontWeight:500,marginBottom:20}}>
              Por ahora hacemos delivery solo en zonas céntricas de Ciudad de Panamá. Confirma que tu ubicación está dentro de nuestra cobertura.
            </p>
            <div style={{background:"var(--bg3)",border:"1px solid var(--bd2)",borderRadius:14,padding:"16px",marginBottom:20,textAlign:"left"}}>
              <div style={{fontSize:11,fontWeight:800,color:"var(--fire3)",letterSpacing:"2px",textTransform:"uppercase",fontFamily:"var(--fm)",marginBottom:12}}>✅ Zonas con cobertura</div>
              {[["🏢","Obarrio"],["🏙️","San Francisco"],["🌊","Costa del Este"],["🏘️","Versalles"],["⛪","Santa María"],["👑","Condado del Rey"],["🏛️","Zonas céntricas de la ciudad"]].map(([icon,zona])=>(
                <div key={zona} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid var(--bd)"}}>
                  <span style={{fontSize:18}}>{icon}</span>
                  <span style={{fontSize:14,fontWeight:700,color:"var(--cream)"}}>{zona}</span>
                </div>
              ))}
            </div>
            <div style={{background:"rgba(255,26,0,.06)",border:"1px solid rgba(255,26,0,.15)",borderRadius:10,padding:"10px 14px",marginBottom:20,fontSize:12,color:"var(--tx2)",fontWeight:600,lineHeight:1.5,fontFamily:"var(--fm)"}}>
              ⚠️ Si tu zona no aparece en la lista, por el momento no podemos llegar hasta ti. Próximamente expandimos cobertura.
            </div>
            <button className="btn-wow" style={{margin:"0 0 10px",width:"100%"}}
              onClick={()=>{setShowZoneCheck(false);setShowReg(true);}}>
              ✅ Sí, estoy en la zona — Registrarme
            </button>
            <button className="btn-back-wow" style={{margin:"0 0 24px",width:"100%"}}
              onClick={()=>setShowZoneCheck(false)}>
              No estoy en la zona — Cerrar
            </button>
          </div>
        </div>
      </div>
    )}
    {showReg&&<RegistrationScreen onClose={()=>setShowReg(false)} onSuccess={handleRegSuccess} toast$={toast$}/>}
    {showAdmin&&<AdminPanel onClose={()=>setShowAdmin(false)} toast$={toast$} onSaved={handleSaved} previewMode={previewMode} setPreviewMode={(v)=>{setPreviewMode(v);localStorage.setItem("nl_preview",v?"1":"0");}}/>}
    <Toast msg={toast.msg} type={toast.type}/>
  </>);
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
